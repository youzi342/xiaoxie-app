<style>
  :root{
    --yellow:#FFD43B;
    --yellow-soft:#FFF3C4;
    --yellow-deep:#F2B705;
    --yellow-cream:#FFFBEB;
    --brown:#6B4E16;
    --brown-soft:#9C7A2E;
    --pink:#FF9EB5;
    --green:#7BC96F;
    --red:#FF6B6B;
    --blue:#5BC0EB;
    --shadow:0 6px 18px rgba(180,140,0,.18);
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;}
  html,body{height:100%;}
  body{
    background:linear-gradient(135deg,#FFF8E1 0%,#FFF3C4 100%);
    color:var(--brown);
    display:flex;
    overflow:hidden;
  }

  /* ===== 侧边导航 ===== */
  .sidebar{
    width:230px;
    background:linear-gradient(180deg,var(--yellow) 0%,var(--yellow-deep) 100%);
    display:flex;flex-direction:column;
    padding:18px 12px;
    box-shadow:4px 0 18px rgba(180,140,0,.25);
    z-index:5;
  }
  .brand{
    text-align:center;margin-bottom:14px;color:#fff;
  }
  .brand .logo{font-size:34px;}
  .brand .title{font-weight:800;font-size:17px;letter-spacing:1px;text-shadow:0 2px 4px rgba(0,0,0,.15);}
  .nav{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px;}
  .nav::-webkit-scrollbar{width:6px;}
  .nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.5);border-radius:3px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:11px 12px;border-radius:14px;cursor:pointer;
    color:#fff;font-weight:600;font-size:14px;
    transition:all .18s ease;
    background:rgba(255,255,255,.12);
  }
  .nav-item .ic{font-size:20px;width:26px;text-align:center;}
  .nav-item:hover{background:rgba(255,255,255,.3);transform:translateX(3px);}
  .nav-item.active{background:#fff;color:var(--brown);box-shadow:var(--shadow);font-weight:800;}
  .nav-item .badge{
    margin-left:auto;background:var(--red);color:#fff;font-size:11px;
    min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:700;
  }
  .sidebar .foot{margin-top:10px;text-align:center;color:#fff;font-size:12px;opacity:.85;}

  /* ===== 主区域 ===== */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .topbar{
    background:var(--yellow-cream);padding:14px 26px;
    display:flex;align-items:center;gap:20px;flex-wrap:wrap;
    box-shadow:0 3px 10px rgba(180,140,0,.12);z-index:4;
  }
  .clock{font-size:30px;font-weight:800;letter-spacing:1px;color:var(--brown);font-variant-numeric:tabular-nums;}
  .clock small{font-size:14px;font-weight:600;color:var(--brown-soft);margin-left:8px;}
  .quote{
    flex:1;min-width:260px;background:#fff;border-radius:14px;padding:10px 16px;
    box-shadow:var(--shadow);border-left:5px solid var(--yellow-deep);
  }
  .quote .cn{font-weight:700;font-size:15px;}
  .quote .en{font-size:12px;color:var(--brown-soft);font-style:italic;margin-top:2px;}
  .checkin{
    background:var(--green);color:#fff;border:none;border-radius:14px;
    padding:10px 18px;font-weight:800;font-size:14px;cursor:pointer;
    box-shadow:var(--shadow);transition:.18s;display:flex;align-items:center;gap:6px;
  }
  .checkin:hover{transform:scale(1.05);}
  .checkin.done{background:var(--yellow-deep);}
  .date-pill{background:#fff;border-radius:12px;padding:6px 12px;font-weight:700;font-size:13px;box-shadow:var(--shadow);}

  .content{flex:1;overflow-y:auto;padding:24px 26px;scroll-behavior:smooth;}
  .content::-webkit-scrollbar{width:8px;}
  .content::-webkit-scrollbar-thumb{background:var(--yellow-deep);border-radius:4px;}

  .panel{display:none;animation:fade .3s ease;}
  .panel.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  .card{
    background:#fff;border-radius:var(--radius);padding:20px;
    box-shadow:var(--shadow);margin-bottom:18px;border:2px solid var(--yellow-soft);
  }
  .card h2{font-size:20px;margin-bottom:4px;display:flex;align-items:center;gap:8px;}
  .card .sub{color:var(--brown-soft);font-size:13px;margin-bottom:14px;}
  .card h3{font-size:16px;margin:14px 0 8px;color:var(--yellow-deep);}

  /* 通用控件 */
  input,textarea,select{
    width:100%;border:2px solid var(--yellow-soft);border-radius:12px;
    padding:10px 12px;font-size:14px;color:var(--brown);background:var(--yellow-cream);
    outline:none;transition:.15s;font-family:inherit;
  }
  input:focus,textarea:focus,select:focus{border-color:var(--yellow-deep);background:#fff;}
  textarea{resize:vertical;min-height:70px;}
  button.btn{
    background:var(--yellow-deep);color:#fff;border:none;border-radius:12px;
    padding:9px 18px;font-weight:700;font-size:14px;cursor:pointer;transition:.15s;
    box-shadow:var(--shadow);
  }
  button.btn:hover{transform:translateY(-2px);filter:brightness(1.05);}
  button.btn.ghost{background:#fff;color:var(--brown);border:2px solid var(--yellow-soft);box-shadow:none;}
  button.btn.pink{background:var(--pink);}
  button.btn.green{background:var(--green);}
  button.btn.red{background:var(--red);}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .row.tight{gap:6px;}
  label.lbl{font-size:13px;font-weight:700;color:var(--brown-soft);display:block;margin:10px 0 4px;}

  .tag{display:inline-block;background:var(--yellow-soft);color:var(--brown);border-radius:10px;padding:3px 10px;font-size:12px;font-weight:700;margin:2px;}

  /* 列表项 */
  .item{
    background:var(--yellow-cream);border-radius:12px;padding:11px 14px;margin-bottom:8px;
    display:flex;align-items:center;gap:10px;border:1.5px solid transparent;
  }
  .item:hover{border-color:var(--yellow);}
  .item .txt{flex:1;font-size:14px;}
  .item.done .txt{text-decoration:line-through;color:var(--brown-soft);}
  .item .act{display:flex;gap:6px;}
  .mini-btn{border:none;background:var(--yellow-soft);border-radius:8px;padding:4px 9px;cursor:pointer;font-size:12px;font-weight:700;color:var(--brown);}
  .mini-btn:hover{background:var(--yellow);}
  .mini-btn.del{background:#FFE0E0;color:var(--red);}
  .mini-btn.del:hover{background:var(--red);color:#fff;}

  .chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--yellow-deep);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex-shrink:0;}
  .chk.on{background:var(--green);border-color:var(--green);}

  /* 进度/统计 */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:10px 0;}
  .stat{background:var(--yellow-cream);border-radius:14px;padding:14px;text-align:center;border:2px solid var(--yellow-soft);}
  .stat .num{font-size:26px;font-weight:800;color:var(--yellow-deep);}
  .stat .lab{font-size:12px;color:var(--brown-soft);margin-top:2px;}

  .pill-date{font-size:12px;color:var(--brown-soft);background:var(--yellow-soft);border-radius:8px;padding:2px 8px;}

  /* 日历 */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal .dow{text-align:center;font-weight:800;font-size:12px;color:var(--brown-soft);padding:4px 0;}
  .cal .cell{
    aspect-ratio:1;border-radius:10px;text-align:center;display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-size:13px;cursor:pointer;background:var(--yellow-cream);
    border:2px solid transparent;position:relative;
  }
  .cal .cell:hover{border-color:var(--yellow-deep);}
  .cal .cell.today{background:var(--yellow);font-weight:800;}
  .cal .cell.sel{outline:3px solid var(--pink);}
  .cal .cell .dot{width:6px;height:6px;border-radius:50%;background:var(--pink);position:absolute;bottom:5px;}

  /* 饮食上传 */
  .upload-zone{
    border:3px dashed var(--yellow-deep);border-radius:16px;padding:20px;text-align:center;
    background:var(--yellow-cream);cursor:pointer;color:var(--brown-soft);font-weight:600;transition:.15s;
  }
  .upload-zone:hover{background:var(--yellow-soft);}
  .preview{margin-top:10px;text-align:center;}
  .preview img{max-width:100%;max-height:200px;border-radius:12px;box-shadow:var(--shadow);}

  /* 食物热量表提示 */
  .hint{background:var(--yellow-soft);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--brown);margin:8px 0;}

  /* 口语默写 */
  .review-box{background:var(--yellow-cream);border-radius:14px;padding:16px;border-left:5px solid var(--pink);margin:10px 0;}
  .review-box .en{font-size:16px;font-weight:700;}
  .review-box .cn{color:var(--brown-soft);font-size:13px;margin-top:4px;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(40px);
    background:var(--brown);color:#fff;padding:12px 22px;border-radius:14px;font-weight:700;
    opacity:0;transition:.3s;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.25);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .seg{display:flex;gap:6px;flex-wrap:wrap;}
  .seg button{border:2px solid var(--yellow-soft);background:#fff;border-radius:10px;padding:6px 14px;font-weight:700;cursor:pointer;color:var(--brown);font-size:13px;}
  .seg button.on{background:var(--yellow-deep);color:#fff;border-color:var(--yellow-deep);}

  .meal-block{border:2px solid var(--yellow-soft);border-radius:14px;padding:14px;margin:10px 0;background:var(--yellow-cream);}
  .meal-block .mt{font-weight:800;color:var(--yellow-deep);margin-bottom:8px;display:flex;align-items:center;gap:6px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{border:1px solid var(--yellow-soft);padding:8px;text-align:left;}
  th{background:var(--yellow-soft);}

  .empty{text-align:center;color:var(--brown-soft);padding:20px;font-size:14px;}
  .book-cover{font-size:60px;text-align:center;margin:6px 0;}
  .news-tag{display:inline-block;background:var(--pink);color:#fff;border-radius:8px;padding:2px 8px;font-size:11px;font-weight:700;margin-right:6px;}
  .econ-tag{display:inline-block;background:var(--blue);color:#fff;border-radius:8px;padding:2px 8px;font-size:11px;font-weight:700;margin-right:6px;}
  @media(max-width:760px){
    .sidebar{width:78px;}.nav-item span{display:none;}.nav-item{justify-content:center;}
    .brand .title{display:none;}.clock{font-size:22px;}
  }
</style>
</head>
<body>
  <!-- 侧边导航 -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">🐤</div>
      <div class="title">我的工作台</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">💛 数据本地保存<br/>每天陪你一点点变好</div>
  </aside>

  <!-- 主区 -->
  <div class="main">
    <div class="topbar">
      <div class="clock" id="clock">--:--:--</div>
      <div class="date-pill" id="datePill"></div>
      <div class="quote">
        <div class="cn" id="quoteCn">加载中…</div>
        <div class="en" id="quoteEn"></div>
      </div>
      <button class="checkin" id="checkinBtn">✅ 今日打卡</button>
    </div>
    <div class="content" id="content"></div>
  </div>

  <div class="toast" id="toast"></div>

<script>
/* =========================================================

// ===== 单文件版：内联 manifest（data URI） =====

  var manifest = {

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const todayStr = () => new Date().toISOString().slice(0,10);
const dayKey = d => d.toISOString().slice(0,10);
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000);}
function load(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v));}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}

function quoteFor(dateStr){
  const idx=Math.abs(hashStr(dateStr))%QUOTES.length;
  return QUOTES[idx];
}
function hashStr(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;}return h;}

function renderNav(){

    el.className='nav-item'+(m.id===cur?' active':'');

    el.innerHTML=`<span class="ic">${m.icon}</span><span>${m.name}</span><span class="badge" id="badge-${m.id}" style="display:none"></span>`;

}

function tick(){
  const n=new Date();
  const p=x=>String(x).padStart(2,'0');
  $('#clock').innerHTML=`${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}<small>${['周日','周一','周二','周三','周四','周五','周六'][n.getDay()]}</small>`;
  $('#datePill').textContent=n.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'});
}
function renderTop(){
  const q=quoteFor(todayStr());
  $('#quoteCn').textContent=q.cn;
  $('#quoteEn').textContent=q.en;
  const ci=load('checkin',{});
  const btn=$('#checkinBtn');
  if(ci[todayStr()]){btn.textContent='🌟 已打卡 '+ci[todayStr()];btn.classList.add('done');}
  else{btn.textContent='✅ 今日打卡';btn.classList.remove('done');}
}
$('#checkinBtn').onclick=()=>{
  const ci=load('checkin',{});
  if(ci[todayStr()]){toast('今天已经打卡啦 🌟');return;}
  ci[todayStr()]=(ci[todayStr()]||0)+1;save('checkin',ci);
  renderTop();updateBadges();toast('打卡成功，继续加油！💪');
};

/* ---------- ① 每日计划 ---------- */
function panelPlan(c){
  const d=todayStr();
  const data=load('plan',{});
  const list=(data[d]||[]);
  let html=`<div class="card">
    <h2>📝 每日计划</h2>
    <div class="sub">列出今天的待办事项，每天自动保存。可切换日期查看 / 补记历史。</div>
    <div class="row">
      <input id="planIn" placeholder="今天要做什么？回车添加 ✍️" />
      <button class="btn" id="planAdd">添加</button>
    </div>
    <div id="planList" style="margin-top:14px"></div>
  </div>`;
  // 历史日期选择器
  const dates=Object.keys(data).sort().reverse();
  html+=`<div class="card"><h2>🗓️ 历史记录</h2><div class="sub">点击日期查看当天的计划（只读）。</div><div class="row tight" id="histDates"></div><div id="histView" style="margin-top:12px"></div></div>`;
  c.innerHTML=html;

  function drawList(){
    const box=$('#planList');
    if(!list.length){box.innerHTML='<div class="empty">还没有计划，添加第一条吧～</div>';return;}
    box.innerHTML=list.map((it,i)=>`
      <div class="item ${it.done?'done':''}">
        <div class="chk ${it.done?'on':''}" data-i="${i}">${it.done?'✔':''}</div>
        <div class="txt">${esc(it.text)}</div>
        <div class="act"><button class="mini-btn del" data-del="${i}">删</button></div>
      </div>`).join('');
    box.querySelectorAll('.chk').forEach(ch=>ch.onclick=()=>{
      list[+ch.dataset.i].done=!list[+ch.dataset.i].done;data[d]=list;save('plan',data);drawList();updateBadges();
    });
    box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
      list.splice(+b.dataset.del,1);data[d]=list;save('plan',data);drawList();updateBadges();
    });
  }
  $('#planAdd').onclick=addPlan;
  $('#planIn').onkeydown=e=>{if(e.key==='Enter')addPlan();};
  function addPlan(){
    const v=$('#planIn').value.trim();if(!v){toast('写点什么吧～');return;}
    list.push({text:v,done:false});data[d]=list;save('plan',data);
    $('#planIn').value='';drawList();updateBadges();
  }
  drawList();
  // 历史
  const hd=$('#histDates');
  if(!dates.length){hd.innerHTML='<div class="empty">暂无历史</div>';}
  else hd.innerHTML=dates.map(dt=>`<button class="mini-btn" data-dt="${dt}">${dt.slice(5)} (${data[dt].filter(x=>x.done).length}/${data[dt].length})</button>`).join('');
  hd.querySelectorAll('[data-dt]').forEach(b=>b.onclick=()=>{
    const dt=b.dataset.dt;const items=data[dt]||[];
    $('#histView').innerHTML=`<div class="pill-date">${dt} 共 ${items.length} 项，完成 ${items.filter(x=>x.done).length} 项</div>`+
      (items.length?items.map(it=>`<div class="item ${it.done?'done':''}"><div class="chk ${it.done?'on':''}">${it.done?'✔':''}</div><div class="txt">${esc(it.text)}</div></div>`).join(''):'<div class="empty">当天无记录</div>');
  });
}

function panelEng(c){
  const d=todayStr();
  const learn=load('eng_learn',{});   // 已学句子索引（按首次学习日期）
  const reviews=load('eng_review',{}); // 复习记录 {dateKey:[{idx,ok}]}
  // 今日新句子：取今日 index
  const newIdx=Math.abs(hashStr('eng'+d))%ENGLISH.length;
  const today=new Date(d);
  const intervals=[1,2,4,7,15,30]; // 艾宾浩斯
  // 找出今天需要复习的（之前学过且间隔命中）
  let due=[];
  Object.keys(learn).forEach(ld=>{
    const idx=learn[ld];
    intervals.forEach(iv=>{
      if(daysBetween(ld,d)===iv) due.push({idx,from:ld});
    });
  });
  // 去重
  const seen=new Set();due=due.filter(x=>{if(seen.has(x.idx))return false;seen.add(x.idx);return true;});

  let html=`<div class="card">
    <h2>🗣️ 英语口语</h2>
    <div class="sub">每天一句实用口语 + 一篇短句。学完后明天起按 <b>艾宾浩斯遗忘曲线</b>（1/2/4/7/15/30天）安排复习默写。</div>
    <h3>🌟 今日新学</h3>
    <div class="review-box"><div class="en">${ENGLISH[newIdx].en}</div><div class="cn">${ENGLISH[newIdx].cn}</div></div>`;
  // 是否已学今天
  const learnedToday=learn[d]!==undefined;
  html+= learnedToday
    ? `<button class="btn green" disabled>✅ 今日已学</button>`
    : `<button class="btn" id="learnBtn">我记住了，标记已学 📌</button>`;
  html+=`</div>`;

  // 复习区
  html+=`<div class="card"><h2>🔁 今日复习（默写）</h2>`;
  if(!due.length){html+=`<div class="empty">今天没有需要复习的内容 🎉</div>`;}
  else{
    html+='<div id="reviewArea">';
    due.forEach((r,i)=>{

    $('#reviewArea').querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{

      const inp=document.querySelector(`.rv-in[data-idx="${due[i].idx}"]`);
      const ans=inp.value.trim().toLowerCase().replace(/[.?]/g,'');
      const cor=ENGLISH[due[i].idx].en.toLowerCase().replace(/[.?]/g,'');

      const res=document.querySelector(`.rv-res[data-res="${i}"]`);

}

function panelMoney(c){
  const d=todayStr();
  const data=load('money',{}); // {date:[{cat,amt,note}]}

  let total=list.reduce((s,x)=>s+x.amt,0);
  let html=`<div class="card">
    <h2>💰 记账存钱</h2>
    <div class="sub">记录每日开支，每月 10 号自动生成上月开支总结。</div>
    <div class="stat-grid">
      <div class="stat"><div class="num">¥${total.toFixed(0)}</div><div class="lab">今日支出</div></div>
      <div class="stat"><div class="num">${list.length}</div><div class="lab">今日笔数</div></div>
      <div class="stat"><div class="num">¥${(load('saveGoal',0))}</div><div class="lab">本月目标结余</div></div>
    </div>
    <div class="row">
      <select id="mCat" style="max-width:140px">
        <option>餐饮</option><option>交通</option><option>购物</option><option>娱乐</option>
        <option>学习</option><option>居住</option><option>医疗</option><option>其他</option>
      </select>
      <input id="mAmt" type="number" placeholder="金额" style="max-width:120px"/>
      <input id="mNote" placeholder="备注（选填）"/>
      <button class="btn" id="mAdd">记一笔</button>
    </div>
    <div id="mList" style="margin-top:14px"></div>
  </div>`;
  // 月度总结
  html+=`<div class="card"><h2>📊 月度开支总结</h2>
    <div class="row"><input id="sumMonth" type="month" value="${d.slice(0,7)}" style="max-width:180px"/><button class="btn ghost" id="genSum">生成总结</button></div>
    <div id="sumView" style="margin-top:12px"></div></div>`;
  c.innerHTML=html;

  function draw(){
    const box=$('#mList');
    if(!list.length){box.innerHTML='<div class="empty">今天还没花钱记录～</div>';return;}
    box.innerHTML=list.map((x,i)=>`<div class="item"><span class="tag">${x.cat}</span><div class="txt">${esc(x.note||'—')}</div><div style="font-weight:800;color:var(--red)">¥${x.amt}</div><button class="mini-btn del" data-i="${i}">删</button></div>`).join('');
    box.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{list.splice(+b.dataset.i,1);data[d]=list;save('money',data);draw();updateBadges();});
  }
  $('#mAdd').onclick=()=>{
    const amt=parseFloat($('#mAmt').value);if(isNaN(amt)||amt<=0){toast('请输入有效金额');return;}
    list.push({cat:$('#mCat').value,amt,note:$('#mNote').value.trim()});data[d]=list;save('money',data);
    $('#mAmt').value='';$('#mNote').value='';draw();updateBadges();renderTopMoney();
  };
  function renderTopMoney(){
    const t=(data[d]||[]).reduce((s,x)=>s+x.amt,0);
    document.querySelectorAll('.stat .num')[0].textContent='¥'+t.toFixed(0);
    document.querySelectorAll('.stat .num')[1].textContent=(data[d]||[]).length;
  }
  draw();
  // 自动提示每月10号
  if(new Date(d).getDate()===10){html&&toast('📅 今天是每月10号，记得生成上月开支总结！');}
  $('#genSum').onclick=()=>{
    const mk=$('#sumMonth').value; // yyyy-mm
    const cats={};let sum=0;let days=0;
    Object.keys(data).forEach(dt=>{
      if(dt.slice(0,7)===mk){days++;data[dt].forEach(x=>{cats[x.cat]=(cats[x.cat]||0)+x.amt;sum+=x.amt;});}
    });
    let v=`<div class="pill-date">${mk} 月份 · 共支出 ¥${sum.toFixed(2)} · 记录 ${days} 天</div>`;
    if(!sum){v+='<div class="empty">该月暂无记录</div>';}
    else{
      v+='<table><tr><th>类别</th><th>金额</th><th>占比</th></tr>'+
        Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v2])=>`<tr><td>${k}</td><td>¥${v2.toFixed(2)}</td><td>${(v2/sum*100).toFixed(1)}%</td></tr>`).join('')+
        `<tr><th>合计</th><th>¥${sum.toFixed(2)}</th><th>100%</th></tr></table>`;
    }
    $('#sumView').innerHTML=v;
  };
}

/* ---------- ⑧ 每日饮食 ---------- */
const FOODKB={ // 常见食物每100g/份 估算大卡
 "米饭(1碗)":230,"馒头(1个)":220,"面条(1碗)":280,"全麦面包(2片)":160,
 "鸡蛋(1个)":70,"鸡胸肉(100g)":130,"红烧肉(100g)":480,"青菜(1份)":30,
 "番茄(1个)":25,"苹果(1个)":95,"香蕉(1根)":105,"牛奶(1杯)":150,
 "酸奶(1杯)":120,"豆腐(100g)":80,"鱼(100g)":120,"土豆(1个)":160,
 "包子(1个)":200,"饺子(10个)":450,"沙拉(1份)":120,"咖啡(1杯)":5,
};
function panelFood(c){
  const d=todayStr();
  const data=load('food_today',{});
  const day=data[d]||{meals:{},total:0};
  let html=`<div class="card">
    <h2>🍱 每日饮食</h2>
    <div class="sub">拍下三餐，我帮你估算热量并给具体到菜名的建议。（离线版：上传照片做记录，下方选择/填写菜品自动累计热量）</div>
    <div class="stat-grid">
      <div class="stat"><div class="num">${day.total}</div><div class="lab">今日总热量(大卡)</div></div>
      <div class="stat"><div class="num">${load('profile',{weight:59}).weight<=52?'👍':'⚠️'}</div><div class="lab">状态</div></div>
    </div>
    <div class="upload-zone" id="upz">📷 点击上传今日餐食照片（仅本地保存，做饮食记录）</div>
    <input type="file" id="fileIn" accept="image/*" style="display:none"/>
    <div class="preview" id="prev"></div>
  </div>`;
  ['早餐','午餐','晚餐','加餐'].forEach(m=>{
    const meals=day.meals[m]||[];
    const sub=meals.reduce((s,x)=>s+x.kcal,0);
    html+=`<div class="meal-block"><div class="mt">${m==='早餐'?'🌅':m==='午餐'?'☀️':m==='晚餐'?'🌙':'🍎'} ${m} · ${sub} 大卡</div>
      <div class="row"><select class="fdSel" data-m="${m}" style="max-width:200px"><option value="">— 选常见食物 —</option>${Object.keys(FOODKB).map(k=>`<option>${k}</option>`).join('')}</select>
      <input class="fdName" data-m="${m}" placeholder="或手填菜名" style="max-width:160px"/>
      <input class="fdKcal" data-m="${m}" type="number" placeholder="热量" style="max-width:90px"/>
      <button class="btn green fdAdd" data-m="${m}">加</button></div>
      <div id="ml-${m}" style="margin-top:8px"></div></div>`;
  });
  html+=`<div class="card"><h2>💡 饮食建议</h2><div id="foodAdv"></div></div>`;
  c.innerHTML=html;
  // 上传
  $('#upz').onclick=()=>$('#fileIn').click();
  $('#fileIn').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();r.onload=ev=>{$('#prev').innerHTML=`<img src="${ev.target.result}"/>`;toast('照片已记录（本地）📷');};
    r.readAsDataURL(f);
  };
  // 添加菜品
  c.querySelectorAll('.fdAdd').forEach(b=>b.onclick=()=>{
    const m=b.dataset.m;
    let name=c.querySelector(`.fdName[data-m="${m}"]`).value.trim();
    let kcal=c.querySelector(`.fdKcal[data-m="${m}"]`).value;
    const sel=c.querySelector(`.fdSel[data-m="${m}"]`).value;
    if(sel){name=sel;kcal=FOODKB[sel];}
    if(!name||isNaN(+kcal)||+kcal<=0){toast('请选择或填写菜名与热量');return;}
    day.meals[m]=day.meals[m]||[];day.meals[m].push({name,kcal:+kcal});
    day.total=Object.values(day.meals).flat().reduce((s,x)=>s+x.kcal,0);
    data[d]=day;save('food_today',data);
    renderPanel();
  });
  // 渲染已加 & 建议
  ['早餐','午餐','晚餐','加餐'].forEach(m=>{
    const box=$('#ml-'+m);const items=day.meals[m]||[];
    box.innerHTML=items.length?items.map((x,i)=>`<span class="tag" style="cursor:pointer" data-m="${m}" data-i="${i}">${esc(x.name)} ${x.kcal}k ✕</span>`).join(''):'<span style="color:var(--brown-soft);font-size:12px">未记录</span>';
    box.querySelectorAll('[data-i]').forEach(s=>s.onclick=()=>{day.meals[m].splice(+s.dataset.i,1);day.total=Object.values(day.meals).flat().reduce((s2,x2)=>s2+x2.kcal,0);data[d]=day;save('food_today',data);renderPanel();});
  });
  // 建议：根据菜名给修改意见
  const all=Object.values(day.meals).flat();
  let adv='';
  if(!all.length)adv='<div class="empty">记录三餐后可获得针对菜名的饮食建议 🍽️</div>';
  else{
    if(all.some(x=>/红烧肉|炸|油|肥肉/.test(x.name)))adv+='🔸 检测到高脂菜品（如红烧肉），建议减半份量，搭配青菜平衡。<br/>';
    if(all.some(x=>/米饭|馒头|面条|面包|土豆/.test(x.name)))adv+='🔸 主食偏多，建议用半碗杂粮饭替代白米饭，更抗饿稳糖。<br/>';
    if(!all.some(x=>/青菜|番茄|沙拉|豆腐|蔬菜/.test(x.name)))adv+='🔸 缺少蔬菜，建议加一份清炒时蔬（约30大卡）。<br/>';
    if(day.total>1600)adv+='🔸 今日热量已超 1600，晚餐建议清淡（蔬菜汤+蛋白质）。<br/>';
    if(day.total&&day.total<=1600)adv+='🔸 热量控制不错，继续保持均衡搭配 👍<br/>';
    adv+='<div class="hint">小个子减脂参考：每日 1300-1500 大卡较合适，三餐比例约 3:4:3。</div>';
  }
  $('#foodAdv').innerHTML=adv;
}

/* ---------- ⑨ 时间记录 ---------- */
function panelTime(c){
  const d=todayStr();
  const data=load('time_log',{});
  const list=(data[d]||[]);
  let totalMin=list.reduce((s,x)=>s+x.dur,0);
  let html=`<div class="card">
    <h2>⏰ 时间记录</h2>
    <div class="sub">记录上课节次与时间，自动汇总今日总时长。</div>
    <div class="stat-grid">
      <div class="stat"><div class="num">${list.length}</div><div class="lab">今日节次</div></div>
      <div class="stat"><div class="num">${Math.floor(totalMin/60)}h${totalMin%60}m</div><div class="lab">总时长</div></div>
    </div>
    <div class="row">
      <input id="tName" placeholder="节次/课程名（如 高数第3节）" style="max-width:220px"/>
      <input id="tStart" type="time" style="max-width:120px"/>
      <input id="tEnd" type="time" style="max-width:120px"/>
      <button class="btn" id="tAdd">记录</button>
    </div>
    <div id="tList" style="margin-top:14px"></div>
  </div>`;
  // 时间轴
  html+=`<div class="card"><h2>📊 今日时间轴</h2><div id="tAxis"></div></div>`;
  c.innerHTML=html;
  $('#tAdd').onclick=()=>{
    const name=$('#tName').value.trim();const s=$('#tStart').value;const e=$('#tEnd').value;
    if(!name||!s||!e){toast('请填完整');return;}
    const dur=(Number(e.split(':')[0])*60+Number(e.split(':')[1]))-(Number(s.split(':')[0])*60+Number(s.split(':')[1]));
    if(dur<=0){toast('结束时间需晚于开始');return;}
    list.push({name,start:s,end:e,dur});data[d]=list;save('time_log',data);
    $('#tName').value='';renderPanel();updateBadges();
  };
  function draw(){
    $('#tList').innerHTML=list.length?list.map((x,i)=>`<div class="item"><span class="tag">${x.start}-${x.end}</span><div class="txt">${esc(x.name)}</div><div style="font-weight:800">${x.dur}分</div><button class="mini-btn del" data-i="${i}">删</button></div>`).join(''):'<div class="empty">今天还没记录课程时间</div>';
    $('#tList').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{list.splice(+b.dataset.i,1);data[d]=list;save('time_log',data);renderPanel();updateBadges();});
    // 轴
    const axis=$('#tAxis');
    if(!list.length){axis.innerHTML='<div class="empty">添加后生成时间轴</div>';return;}
    axis.innerHTML=list.sort((a,b)=>a.start.localeCompare(b.start)).map(x=>`<div class="item"><div class="chk on">⏱</div><div class="txt"><b>${x.start}–${x.end}</b> ${esc(x.name)}</div><div style="color:var(--brown-soft)">${x.dur}分钟</div></div>`).join('');
  }
  draw();
}

function panelWork(c){
  const ev=load('work_events',[]); // {date,title,note,tag}
  let html=`<div class="card">
    <h2>💼 事件记录（工作）</h2>
    <div class="sub">工作留痕，按日期随时查看。下方可新增，日历可跳到任意日期。</div>

      <input id="wDate" type="date" value="${todayStr()}" style="max-width:160px"/>
      <input id="wTitle" placeholder="事件标题" style="max-width:200px"/>
      <select id="wTag" style="max-width:120px"><option>会议</option><option>任务</option><option>邮件</option><option>复盘</option><option>其他</option></select>
    </div>
    <textarea id="wNote" placeholder="细节 / 结论 / 待办…"></textarea>
    <button class="btn" id="wAdd" style="margin-top:8px">记录事件</button>
  </div>`;
  // 月历
  const viewYM=load('work_ym',todayStr().slice(0,7));
  html+=`<div class="card"><h2>📅 工作日历（${viewYM}）</h2>
    <div class="row"><input id="calYM" type="month" value="${viewYM}" style="max-width:170px"/><button class="btn ghost" id="calGo">查看</button></div>
    <div class="cal" id="cal" style="margin-top:12px"></div>
    <div id="calEvents" style="margin-top:12px"></div></div>`;
  c.innerHTML=html;
  $('#wAdd').onclick=()=>{
    const date=$('#wDate').value;const title=$('#wTitle').value.trim();
    if(!date||!title){toast('请填日期和标题');return;}
    ev.unshift({date,title,note:$('#wNote').value.trim(),tag:$('#wTag').value});
    save('work_events',ev);$('#wTitle').value='';$('#wNote').value='';toast('已记录 💼');renderPanel();updateBadges();
  };
  function drawCal(){
    const ym=$('#calYM').value||viewYM;save('work_ym',ym);
    const [Y,M]=ym.split('-').map(Number);
    const first=new Date(Y,M-1,1).getDay();const days=new Date(Y,M,0).getDate();
    const evMap={};ev.forEach(e=>{evMap[e.date]=(evMap[e.date]||0)+1;});
    let cells='<div class="dow">日</div><div class="dow">一</div><div class="dow">二</div><div class="dow">三</div><div class="dow">四</div><div class="dow">五</div><div class="dow">六</div>';
    for(let i=0;i<first;i++)cells+='<div class="cell"></div>';
    for(let dd=1;dd<=days;dd++){
      const ds=`${ym}-${String(dd).padStart(2,'0')}`;
      const cls='cell'+(ds===todayStr()?' today':'')+(ds===$('#wDate').value?' sel':'');
      cells+=`<div class="${cls}" data-ds="${ds}">${dd}${evMap[ds]?`<span class="dot"></span>`:''}</div>`;
    }
    $('#cal').innerHTML=cells;
    $('#cal').querySelectorAll('[data-ds]').forEach(cell=>cell.onclick=()=>{
      const ds=cell.dataset.ds;$('#wDate').value=ds;
      const items=ev.filter(e=>e.date===ds);
      $('#calEvents').innerHTML=`<div class="pill-date">${ds} 共 ${items.length} 条</div>`+
        (items.length?items.map(x=>`<div class="item"><span class="tag">${x.tag}</span><div class="txt"><b>${esc(x.title)}</b><br/><span style="color:var(--brown-soft);font-size:12px">${esc(x.note||'')}</span></div></div>`).join(''):'<div class="empty">当天无工作记录</div>');
    });
  }
  $('#calGo').onclick=drawCal;drawCal();
}

/* ---------- PWA：注册 Service Worker（支持"添加到主屏幕"） ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    try {
      var swblob = new Blob([`
const CACHE='xx-miss-app-v1';
self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(['.','index.html'])).then(()=>self.skipWaiting()));});
self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()));});
self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(caches.match(e.request).then(c=>c||fetch(e.request).then(r=>{{const cp=r.clone();caches.open(CACHE).then(c=>c.put(e.request,cp));return r;}}).catch(()=>caches.match('index.html'))));});
`], {type:'text/javascript'});
      navigator.serviceWorker.register(URL.createObjectURL(swblob)).catch(()=>{});
    } catch(e){}
  });
}
