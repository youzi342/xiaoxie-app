<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>小谢小姐的app 🐤</title>
<meta name="theme-color" content="#FBE7A1" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="小谢小姐" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  :root{
    --bg:#FFFCF5;
    --yellow:#FFD66B;
    --yellow-soft:#FBE7A1;
    --yellow-deep:#F4B740;
    --yellow-cream:#FFF6E0;
    --brown:#7A6A3A;
    --brown-soft:#A99A6C;
    --pink:#FFB3C1;
    --green:#9ED79A;
    --red:#FF8A8A;
    --blue:#8FCAE7;
    --card:#FFFFFF;
    --line:#F0E6CC;
    --shadow:0 4px 16px rgba(220,180,60,.14);
    --radius:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--brown);display:flex;overflow:hidden;font-size:17px;}

  .sidebar{
    width:200px;flex-shrink:0;
    background:linear-gradient(180deg,var(--yellow-soft) 0%,var(--yellow-cream) 100%);
    display:flex;flex-direction:column;padding:16px 10px;
    border-right:1px solid var(--line);z-index:5;
  }
  .brand{text-align:center;padding:2px 0 6px;border-bottom:1px dashed var(--line);flex-shrink:0;}
  .brand .logo{font-size:22px;}
  .brand .title{font-weight:800;font-size:12px;color:var(--brown);margin-top:1px;letter-spacing:.5px;}
  .nav{flex:1;overflow:hidden;display:flex;flex-direction:column;}
  .nav::-webkit-scrollbar{width:4px;}
  .nav::-webkit-scrollbar-thumb{background:var(--yellow);border-radius:2px;}
  .nav-item{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    padding:4px 6px;border-radius:14px;cursor:pointer;
    color:var(--brown);font-weight:700;font-size:30px;line-height:1.08;
    transition:all .16s ease;background:transparent;min-height:0;
  }
  .nav-item .ic{font-size:30px;width:32px;text-align:center;flex-shrink:0;line-height:1;}
  .nav-item:hover{background:rgba(255,214,107,.35);}
  .nav-item.active{background:#fff;color:var(--brown);box-shadow:var(--shadow);font-weight:800;border:1px solid var(--yellow-soft);}
  .nav-item .badge{
    margin-left:auto;background:var(--red);color:#fff;font-size:10px;
    min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:700;
  }
  .sidebar .foot{flex-shrink:0;text-align:center;color:var(--brown-soft);font-size:10px;padding:4px 4px 1px;line-height:1.25;}

  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
  .topbar{
    background:var(--card);padding:10px 18px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    box-shadow:0 1px 8px rgba(220,180,60,.1);z-index:4;border-bottom:1px solid var(--line);
  }
  .clock{font-size:23px;font-weight:800;letter-spacing:1px;color:var(--brown);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .clock small{font-size:12px;font-weight:600;color:var(--brown-soft);margin-left:6px;display:block;}
  .quote{flex:1;min-width:180px;background:var(--yellow-cream);border-radius:14px;padding:8px 14px;border-left:4px solid var(--yellow-deep);}
  .quote .cn{font-weight:700;font-size:13px;color:var(--brown);line-height:1.3;}
  .quote .en{font-size:10.5px;color:var(--brown-soft);font-style:italic;margin-top:2px;line-height:1.2;}
  .checkin{
    background:var(--yellow-deep);color:#fff;border:none;border-radius:20px;
    padding:8px 15px;font-weight:700;font-size:20px;cursor:pointer;
    box-shadow:var(--shadow);transition:.18s;display:flex;align-items:center;gap:5px;white-space:nowrap;
  }
  .checkin:hover{transform:scale(1.04);}
  .checkin.done{background:var(--green);}

  .content{flex:1;overflow-y:auto;padding:20px;scroll-behavior:smooth;background:var(--bg);}
  .content > .panel{display:block;max-width:560px;margin:0 auto;}
  .content::-webkit-scrollbar{width:6px;}
  .content::-webkit-scrollbar-thumb{background:var(--yellow);border-radius:3px;}

  .panel{display:none;animation:fade .25s ease;}
  .panel.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  .card{background:var(--card);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:18px;border:1px solid var(--line);}
  .card h2{font-size:28px;margin-bottom:4px;display:flex;align-items:center;gap:8px;color:var(--brown);}
  .card .sub{color:var(--brown-soft);font-size:24px;margin-bottom:16px;line-height:1.6;}
  .card h3{font-size:24px;margin:18px 0 10px;color:var(--yellow-deep);}

  input,textarea,select{
    width:100%;border:1.5px solid var(--line);border-radius:12px;
    padding:12px 14px;font-size:24px;color:var(--brown);background:var(--yellow-cream);
    outline:none;transition:.15s;font-family:inherit;
  }
  input:focus,textarea:focus,select:focus{border-color:var(--yellow-deep);background:#fff;}
  textarea{resize:vertical;min-height:64px;}
  button.btn{
    background:var(--yellow-deep);color:#fff;border:none;border-radius:20px;
    padding:12px 22px;font-weight:700;font-size:24px;cursor:pointer;transition:.15s;
    box-shadow:var(--shadow);white-space:nowrap;
  }
  button.btn:hover{transform:translateY(-1px);filter:brightness(1.04);}
  button.btn.ghost{background:#fff;color:var(--brown);border:1.5px solid var(--line);box-shadow:none;}
  button.btn.pink{background:var(--pink);}
  button.btn.green{background:var(--green);}
  button.btn.red{background:var(--red);}
  button.btn.blue{background:var(--blue);}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;}
  .row > *{flex:0 0 auto;}
  .grow{flex:1 1 120px !important;min-width:120px;}

  .tag{display:inline-block;background:var(--yellow-cream);color:var(--brown);border-radius:12px;padding:3px 10px;font-size:24px;font-weight:700;margin:2px 3px 2px 0;border:1px solid var(--line);}
  .tag.big{font-size:13px;padding:5px 12px;}

  .item{background:var(--yellow-cream);border-radius:12px;padding:13px 15px;margin-bottom:9px;display:flex;align-items:center;gap:10px;border:1.5px solid transparent;}
  .item:hover{border-color:var(--yellow);}
  .item .txt{flex:1;font-size:24px;line-height:1.5;}
  .item.done .txt{text-decoration:line-through;color:var(--brown-soft);}
  .item .act{display:flex;gap:6px;flex-shrink:0;}
  .mini-btn{border:none;background:#fff;border-radius:9px;padding:6px 12px;cursor:pointer;font-size:24px;font-weight:700;color:var(--brown-soft);border:1px solid var(--line);}
  .mini-btn:hover{background:var(--yellow-soft);color:var(--brown);}
  .mini-btn.del{color:var(--red);}
  .mini-btn.del:hover{background:var(--red);color:#fff;border-color:var(--red);}
  .chk{width:21px;height:21px;border-radius:7px;border:2px solid var(--yellow-deep);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex-shrink:0;transition:.15s;}
  .chk.on{background:var(--green);border-color:var(--green);}

  .prio{font-size:11px;font-weight:800;border-radius:8px;padding:2px 7px;flex-shrink:0;}
  .prio.high{background:var(--red);color:#fff;}
  .prio.mid{background:var(--yellow);color:var(--brown);}
  .prio.low{background:#EDE7D6;color:var(--brown-soft);}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0;}
  .stat{background:var(--yellow-cream);border-radius:14px;padding:15px;text-align:center;border:1px solid var(--line);}
  .stat .num{font-size:28px;font-weight:800;color:var(--yellow-deep);}
  .stat .lab{font-size:13px;color:var(--brown-soft);margin-top:3px;}
  .progress{height:10px;background:var(--yellow-cream);border-radius:6px;overflow:hidden;border:1px solid var(--line);}
  .progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--yellow-deep));border-radius:6px;transition:width .4s;}

  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .cal .dow{text-align:center;font-weight:800;font-size:11px;color:var(--brown-soft);padding:3px 0;}
  .cal .cell{
    aspect-ratio:1;border-radius:10px;text-align:center;display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-size:12px;cursor:pointer;background:var(--yellow-cream);
    border:1.5px solid transparent;position:relative;color:var(--brown);
  }
  .cal .cell:hover{border-color:var(--yellow-deep);}
  .cal .cell.today{background:var(--yellow);font-weight:800;}
  .cal .cell.sel{outline:3px solid var(--pink);}
  .cal .cell .dot{width:6px;height:6px;border-radius:50%;background:var(--pink);position:absolute;bottom:4px;}
  .cal .cell .dot.g{background:var(--green);}

  .grid{display:grid;grid-template-columns:1fr;gap:12px;}
  .tile{background:var(--yellow-cream);border-radius:14px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;}
  .tile .thumb{height:120px;background:linear-gradient(135deg,var(--yellow-soft),var(--pink));display:flex;align-items:center;justify-content:center;font-size:40px;}
  .tile .body{padding:14px;flex:1;display:flex;flex-direction:column;gap:7px;}
  .tile .tt{font-weight:800;font-size:16.5px;color:var(--brown);line-height:1.35;}
  .tile .td{font-size:14px;color:var(--brown-soft);line-height:1.5;flex:1;}
  .tile .jump{margin-top:auto;}
  .tile .jump a{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:14px;font-weight:700;color:var(--brown);text-decoration:none;}
  .tile .jump a:hover{background:var(--yellow-soft);}
  .tile .src{font-size:12px;color:var(--brown-soft);background:#fff;border-radius:8px;padding:2px 8px;display:inline-block;margin-bottom:2px;border:1px solid var(--line);}

  .report{background:var(--yellow-cream);border-radius:14px;padding:16px;border-left:4px solid var(--yellow-deep);font-size:24px;line-height:1.8;color:var(--brown);}
  .report h4{color:var(--yellow-deep);margin:12px 0 5px;font-size:24px;}
  .review-list{list-style:none;counter-reset:rv;}
  .review-list li{counter-increment:rv;background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:8px;font-size:24px;line-height:1.6;border:1px solid var(--line);position:relative;padding-left:38px;}
  .review-list li::before{content:counter(rv);position:absolute;left:11px;top:11px;width:20px;height:20px;background:var(--yellow-deep);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
  /* 读书报告模块：整体统一 24px */
  .book-panel h2,.book-panel .sub,.book-panel h3,.book-panel .report,.book-panel .review-list li,.book-panel .bk-author{font-size:24px;}
  .book-panel h2{font-size:24px;}
  .book-panel .sub{font-size:24px;line-height:1.6;}
  .book-panel h3{font-size:24px;}
  .book-panel .report{font-size:24px;line-height:1.8;}
  .book-panel .review-list li{font-size:24px;line-height:1.6;}
  .book-panel .bk-author{font-size:24px;color:var(--brown-soft);margin-top:2px;}
  /* 英语口语模块：整体统一 30px */
  .eng-panel h2,.eng-panel .sub,.eng-panel h3{font-size:30px;}
  .eng-panel h2{font-size:30px;}
  .eng-panel .sub{font-size:30px;line-height:1.6;}
  .eng-panel h3{font-size:30px;}
  .eng-panel #cnbox{font-size:30px;line-height:1.7;}
  .eng-panel .item .txt b{font-size:30px;}
  .eng-panel .item .txt span{font-size:30px;}

  .water-grid{display:grid;grid-template-columns:1fr;gap:10px;}
  .water-card{background:var(--yellow-cream);border-radius:14px;padding:15px 18px;text-align:left;border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  .water-card .t{font-weight:800;font-size:24px;color:var(--brown);}
  .water-card .amt{font-size:20px;font-weight:800;color:var(--blue);}
  .water-card .st{font-size:13px;color:var(--brown-soft);}
  .water-card.done{background:var(--green);border-color:var(--green);}
  .water-card.done .t,.water-card.done .st{color:#fff;}
  .water-card.done .amt{color:#fff;}

  .alert{background:var(--pink);color:#fff;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:700;margin-bottom:10px;display:none;align-items:center;gap:8px;}
  .alert.show{display:flex;}

  .tip{background:#fff;border-radius:14px;padding:14px;border:1px solid var(--line);margin-bottom:10px;}
  .tip .day{font-size:11px;color:var(--brown-soft);}
  .tip .ttl{font-weight:800;font-size:15px;color:var(--yellow-deep);margin:3px 0 6px;display:flex;align-items:center;gap:6px;}
  .tip .ex{font-size:13px;line-height:1.6;color:var(--brown);background:var(--yellow-cream);border-radius:10px;padding:9px 12px;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(40px);background:var(--brown);color:#fff;padding:11px 20px;border-radius:22px;font-weight:700;opacity:0;transition:.3s;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.2);font-size:13px;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .empty{text-align:center;color:var(--brown-soft);padding:18px;font-size:13px;}
  .pill{font-size:24px;color:var(--brown-soft);background:var(--yellow-cream);border-radius:10px;padding:3px 10px;border:1px solid var(--line);}
  .seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  .seg button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:6px 13px;font-weight:700;cursor:pointer;color:var(--brown-soft);font-size:20px;}
  .seg button.on{background:var(--yellow-deep);color:#fff;border-color:var(--yellow-deep);}

  table{width:100%;border-collapse:collapse;font-size:24px;margin-top:6px;}
  th,td{border:1px solid var(--line);padding:7px;text-align:left;}
  th{background:var(--yellow-cream);}

  .hint{background:var(--yellow-cream);border-left:3px solid var(--yellow-deep);border-radius:0 12px 12px 0;padding:9px 13px;font-size:24px;color:var(--brown);margin:8px 0;line-height:1.5;}

  @media(max-width:760px){
    .sidebar{width:150px;padding:10px 6px;}
    .nav-item{font-size:30px;padding:4px 6px;gap:5px;}
    .nav-item .ic{font-size:34px;width:36px;}
    .brand .title{display:none;}
    .clock{font-size:19px;}
    .content{padding:16px 12px;}
    .card{padding:18px;}
    .topbar{padding:10px 14px;gap:9px;}
  }
  @media(max-width:430px){
    .sidebar{width:132px;padding:8px 5px;}
    .nav-item{font-size:26px;padding:3px 5px;gap:4px;}
    .nav-item .ic{font-size:30px;width:32px;}
    .clock{font-size:17px;}
    .quote .cn{font-size:12.5px;}
    .content{padding:14px 10px;}
    .card{padding:16px;margin-bottom:14px;}
    .grid{grid-template-columns:1fr;gap:10px;}
  }
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">🐤</div>
      <div class="title">小谢小姐的app</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">本地数据 · 每日更新 💛</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="clock"><span id="clk">--:--</span><small id="dt">----/--/-- 周-</small></div>
      <div class="quote">
        <div class="cn" id="qcn">加载中…</div>
        <div class="en" id="qen"></div>
      </div>
      <button class="checkin" id="checkinBtn">☀️ 今日打卡</button>
    </header>
    <main class="content" id="content"></main>
  </div>

  <div class="toast" id="toast"></div>

<script>
/* ===== 工具 ===== */
const DQ = String.fromCharCode(36); // "$" 防止 shell 转义
const store = {
  get(k,def){ try{ const v=localStorage.getItem('xx_'+k); return v?JSON.parse(v):def; }catch(e){ return def; } },
  set(k,v){ localStorage.setItem('xx_'+k, JSON.stringify(v)); }
};
function $(s){ return document.querySelector(s); }
function $$(s){ return document.querySelectorAll(s); }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function now(){ return new Date(); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove('show'); },1800); }
function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
function weekday(y,m,d){ return '日一二三四五六'[new Date(y,m,d).getDay()]; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); }

/* ===== 每日语录 ===== */
const QUOTES=[
  {cn:'种一棵树最好的时间是十年前，其次是现在。',en:'The best time to plant a tree was ten years ago. The second best is now.'},
  {cn:'你不需要很厉害才能开始，但你需要开始才能很厉害。',en:'You do not have to be great to start, but you have to start to be great.'},
  {cn:'今天的努力，是幸运的伏笔。',en:'Today’s effort is the foreshadowing of tomorrow’s luck.'},
  {cn:'慢慢来，比较快。',en:'Slow is smooth, smooth is fast.'},
  {cn:'把时间花在哪里，就会成为什么样的人。',en:'You become what you spend your time on.'},
  {cn:'先完成，再完美。',en:'Done is better than perfect.'},
  {cn:'你比自己想象的更强大。',en:'You are stronger than you think.'},
  {cn:'每一天都是重新开始的好机会。',en:'Every day is a good chance to begin again.'},
  {cn:'自律给你自由。',en:'Discipline equals freedom.'},
  {cn:'温柔而坚定，是你最好的铠甲。',en:'Gentle yet firm — your best armor.'},
  {cn:'把简单的事做好，就是不简单。',en:'Doing simple things well is not simple at all.'},
  {cn:'你的坚持，终将美好。',en:'Your persistence will eventually blossom.'},
  {cn:'不比较，只超越昨天的自己。',en:'Do not compare, just beat who you were yesterday.'},
  {cn:'生活明朗，万物可爱。',en:'Life is bright, and everything is lovely.'},
  {cn:'好好爱自己，是终身浪漫的开始。',en:'Loving yourself well is the start of a lifelong romance.'}
];
function quoteForDate(){
  const d=today(); let h=0; for(const c of d) h=(h*31+c.charCodeAt(0))>>>0;
  return QUOTES[h%QUOTES.length];
}

/* ===== 时钟 ===== */
function tick(){
  const d=new Date();
  $('#clk').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  $('#dt').textContent=d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')+' 周'+weekday(d.getFullYear(),d.getMonth(),d.getDate());
}
setInterval(tick,1000); tick();

/* ===== 打卡 ===== */
function renderCheckin(){
  const ci=store.get('checkin',{});
  const b=$('#checkinBtn');
  if(ci[today()]){ b.textContent='✅ 已打卡'; b.classList.add('done'); }
  else { b.textContent='☀️ 今日打卡'; b.classList.remove('done'); }
}
$('#checkinBtn').onclick=function(){
  const ci=store.get('checkin',{});
  if(ci[today()]){ delete ci[today()]; toast('已取消今日打卡'); }
  else { ci[today()]=Date.now(); toast('打卡成功，今天也要加油 💛'); }
  store.set('checkin',ci); renderCheckin();
};

/* ===== 菜单 ===== */
const MENUS=[
  {id:'plan',  name:'每日计划', icon:'📝'},
  {id:'eng',   name:'英语口语', icon:'🗣️'},
  {id:'money', name:'记账存钱', icon:'💰'},
  {id:'book',  name:'读书报告', icon:'📚'},
  {id:'water', name:'天天喝水', icon:'💧'},
  {id:'fit',   name:'每日穿搭', icon:'👗'},
  {id:'news',  name:'每日新闻', icon:'📰'},
  {id:'food',  name:'好好吃饭', icon:'🍱'},
  {id:'time',  name:'时间记录', icon:'📅'},
  {id:'work',  name:'事件记录', icon:'💼'},

function show(id){
  $$('.nav-item').forEach(function(n){ n.classList.toggle('active', n.dataset.id===id); });

  (PANELS[id]||function(){})();
}
function panel(id){
  // 严格单模块视图：移除其余面板，只保留当前一个
  $$('.panel').forEach(function(x){ if(x.id!=='panel-'+id) x.remove(); });
  let p=document.getElementById('panel-'+id);
  if(!p){ p=document.createElement('div'); p.className='panel'; p.id='panel-'+id; $('#content').appendChild(p); }
  p.classList.add('active');
  return p;
}
function navBadge(id,n){
  const b=document.getElementById('bdg-'+id); if(!b) return;
  if(n>0){ b.style.display='flex'; b.textContent=n; } else { b.style.display='none'; }
}

/* ============ ① 每日计划 ============ */
function planRender(){
  const p=panel('plan');
  let tasks=store.get('tasks',[]);
  const td=today();
  const list=tasks.filter(function(t){ return !t.date || t.date===td; }).sort(function(a,b){ return (b.prio==='high')-(a.prio==='high'); });
  const done=list.filter(function(t){ return t.done; }).length;
  const rate=list.length?Math.round(done/list.length*100):0;
  p.innerHTML=
    '<div class="card">'+
      '<h2>📝 每日计划</h2>'+
      '<div class="sub">汇总今日全部待办，支持勾选、优先级标记、编辑与删除，自动统计完成率。</div>'+
      '<div class="stat-grid">'+
        '<div class="stat"><div class="num">'+list.length+'</div><div class="lab">今日任务</div></div>'+
        '<div class="stat"><div class="num">'+done+'</div><div class="lab">已完成</div></div>'+
        '<div class="stat"><div class="num">'+rate+'%</div><div class="lab">完成率</div></div>'+
      '</div>'+
      '<div class="progress"><i style="width:'+rate+'%"></i></div>'+
      '<div class="row" style="margin-top:14px">'+
        '<input class="grow" id="nt" placeholder="添加新任务…" />'+
        '<select id="np" style="width:auto">'+
          '<option value="high">🔴 高</option>'+
          '<option value="mid" selected>🟡 中</option>'+
          '<option value="low">⚪ 低</option>'+
        '</select>'+
        '<button class="btn" id="na">添加</button>'+
      '</div>'+
      '<div id="tlist" style="margin-top:10px"></div>'+
    '</div>';
  const tl=$('#tlist');
  if(!list.length){ tl.innerHTML='<div class="empty">还没有任务，添加一条开始吧 🌟</div>'; }
  list.forEach(function(t){
    const d=document.createElement('div'); d.className='item'+(t.done?' done':'');
    const pmap={high:'🔴 高',mid:'🟡 中',low:'⚪ 低'};
    d.innerHTML='<div class="chk '+(t.done?'on':'')+'" data-i="'+t.id+'">'+(t.done?'✓':'')+'</div>'+
      '<div class="prio '+(t.prio||'mid')+'">'+pmap[t.prio||'mid']+'</div>'+
      '<div class="txt">'+esc(t.text)+'</div>'+
      '<div class="act"><button class="mini-btn" data-e="'+t.id+'">编辑</button><button class="mini-btn del" data-d="'+t.id+'">删除</button></div>';
    tl.appendChild(d);
  });
  tl.querySelectorAll('.chk').forEach(function(c){ c.onclick=function(){ const t=tasks.find(function(x){ return x.id===c.dataset.i; }); t.done=!t.done; store.set('tasks',tasks); planRender(); }; });
  tl.querySelectorAll('[data-d]').forEach(function(b){ b.onclick=function(){ tasks=tasks.filter(function(x){ return x.id!==b.dataset.d; }); store.set('tasks',tasks); planRender(); }; });
  tl.querySelectorAll('[data-e]').forEach(function(b){ b.onclick=function(){ const t=tasks.find(function(x){ return x.id===b.dataset.d; }); const nv=prompt('编辑任务：',t.text); if(nv!==null&&nv.trim()){ t.text=nv.trim(); store.set('tasks',tasks); planRender(); } }; });
  $('#na').onclick=function(){ const v=$('#nt').value.trim(); if(!v) return; tasks.push({id:uid(),text:v,prio:$('#np').value,done:false,date:td}); store.set('tasks',tasks); planRender(); };
  $('#nt').onkeydown=function(e){ if(e.key==='Enter') $('#na').click(); };
  navBadge('plan', list.filter(function(t){ return !t.done; }).length);
}

function speechForDate(){
  const d=today(); let h=0; for(const c of d) h=(h*7+c.charCodeAt(0))>>>0;
  return SPEECHES[h%SPEECHES.length];
}
function speak(text){
  if(!('speechSynthesis' in window)){ toast('当前浏览器不支持语音'); return; }
  const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=0.9;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

        '<div class="stat"><div class="num">'+r.recite.count+'</div><div class="lab">累计背诵默写</div></div>'+
      '</div>'+

        '<div style="font-weight:800;color:var(--yellow-deep);margin-bottom:4px">🎬 '+esc(sp.type)+' · '+esc(sp.src)+'</div>'+
        '<div style="font-weight:800;color:var(--brown)">'+esc(sp.en)+'</div>'+
        '<div id="cnbox" style="color:var(--brown-soft);margin:6px 0">'+esc(sp.cn)+'</div>'+

        '</div>'+
        '<div class="row" style="margin-top:6px;flex-wrap:wrap">'+
          '<button class="btn" id="recStart">🎙️ 录音跟读</button>'+
          '<button class="btn red" id="recStop" style="display:none">⏹️ 停止并回放</button>'+
        '</div>'+

      '</div>'+

        '<div class="row" style="flex-wrap:wrap;margin-bottom:8px">'+

      r.shadow.count=r.shadow.count+1; r.shadow.last=today();

      if(!tasks.find(function(t){ return t.en===sp.en; })){

  $('#recStart').onclick=function(){
    const self=this;
    if(!navigator.mediaDevices || !window.MediaRecorder){ toast('当前浏览器不支持录音'); return; }
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      recStream=stream; recChunks=[];
      mediaRec=new MediaRecorder(stream);
      mediaRec.ondataavailable=function(e){ if(e.data.size>0) recChunks.push(e.data); };
      mediaRec.onstop=function(){
        const blob=new Blob(recChunks,{type:mediaRec.mimeType||'audio/webm'});
        const url=URL.createObjectURL(blob);
        $('#audioBox').innerHTML='<div style="color:var(--brown-soft);margin-bottom:4px">🔁 你的跟读录音：</div><audio controls src="'+url+'"></audio>';
        stream.getTracks().forEach(function(t){ t.stop(); });

      };

      toast('录音中，跟读吧 🎙️');
    }).catch(function(){ toast('无法访问麦克风，请检查权限'); });
  };
  $('#recStop').onclick=function(){

  $('#review').onclick=function(){
    const stage=Math.min(r.stage+1,4);

    rec[key]=r; store.set('eng_rec',rec);
    if(!tasks.find(function(t){ return t.en===sp.en; })){ tasks.push({id:uid(),en:sp.en,next:r.next}); store.set('eng_tasks',tasks); }

  };
  $('#toggleCn').onclick=function(){

    $('#cnbox').style.display=cnHidden?'none':'block';
    this.textContent=cnHidden?'👁️ 显示中文':'👁️ 隐藏/显示中文';
  };

    const ok=norm(val)===norm(sp.en);
    res.style.display='block';
    if(ok){
      res.style.color='var(--green)';
      res.textContent='🎉 完全正确！可以打卡啦';
      $('#recite').style.display='inline-block';
      r.recite.count=r.recite.count+1; r.recite.last=today();
      rec[key]=r; store.set('eng_rec',rec);
      const tip=$('#reciteTip'); tip.style.display='block';
      tip.textContent='📝 已打卡！累计背诵 '+r.recite.count+' 次（'+r.recite.last+'）';
      toast('背诵默写打卡 +1 ✅');
    } else {
      res.style.color='var(--red)';
      const u=val.split(/\s+/), a=sp.en.split(/\s+/);
      let wrong=0; for(let i=0;i<Math.max(u.length,a.length);i++){ if(norm(u[i]||'')!==norm(a[i]||'')) wrong++; }
      res.textContent='❌ 有 '+wrong+' 处不一致，对照原文再练练～ 点「看答案」核对';
    }
  };
  $('#showAns').onclick=function(){
    $('#enbox').style.display='block'; enHidden=false; $('#toggleEn').textContent='👁️ 隐藏/显示原文';
    $('#cnbox').style.display='block'; cnHidden=false; $('#toggleCn').textContent='👁️ 隐藏/显示中文';

  $('#recite').onclick=function(){
    const tip=$('#reciteTip'); tip.style.display='block';
    tip.textContent='📝 已打卡！累计背诵 '+r.recite.count+' 次（'+r.recite.last+'）';
    toast('背诵默写打卡 +1 ✅');
  };

}

    '</div>';
  const el=$('#elist');
  if(!me.length){ el.innerHTML='<div class="empty">本月还没有记录，记下第一笔吧 💛</div>'; }
  me.sort(function(a,b){ return b.date.localeCompare(a.date); }).forEach(function(e){
    const d=document.createElement('div'); d.className='item';
    d.innerHTML='<div class="txt"><b>'+esc(e.cat)+'</b> <span class="pill">'+e.date.slice(5)+'</span> '+(e.note?esc(e.note):'')+
        (e.big?'<span class="tag" style="background:var(--red);color:#fff">大额</span>':'')+
        (!e.need?'<span class="tag" style="background:#EDE7D6;color:var(--brown-soft)">不必要</span>':'')+'</div>'+
      '<div style="font-weight:800;color:var(--brown)">¥'+Number(e.amt).toFixed(0)+'</div>'+
      '<div class="act"><button class="mini-btn del" data-d="'+e.id+'">删</button></div>';
    el.appendChild(d);
  });
  el.querySelectorAll('[data-d]').forEach(function(b){ b.onclick=function(){ exp=exp.filter(function(x){ return x.id!==b.dataset.d; }); store.set('exp',exp); moneyRender(); }; });
  $('#ea2').onclick=function(){
    const cat=$('#ec').value.trim(); const amt=parseFloat($('#ea').value);
    if(!cat||isNaN(amt)){ toast('请填类别和金额'); return; }
    exp.push({id:uid(),date:today(),cat:cat,amt:amt,note:'',big:$('#ebig').checked,need:!$('#eun').checked});
    store.set('exp',exp); moneyRender();
  };
}

function bookForDate(){
  const d=today(); let h=0; for(const c of d) h=(h*13+c.charCodeAt(0))>>>0;
  return BOOKS[h%BOOKS.length];
}

    '</div>';

  WATER_PLAN.forEach(function(x,i){
    const d=document.createElement('div'); d.className='water-card'+(done.includes(i)?' done':'');
    d.innerHTML='<div class="t">'+x.t+'</div><div class="amt">'+x.amt+'ml</div><div class="st">'+(done.includes(i)?'✅ 已喝':'待喝')+' · '+x.note+'</div>';

function waterAlert(){
  const nowMin=new Date().getHours()*60+new Date().getMinutes();
  const cur=WATER_PLAN.find(function(x){
    const parts=x.t.split(' ')[0].split(':'); const h=Number(parts[0]); const m=Number(parts[1]);
    const diff=nowMin-(h*60+m); return diff>=0 && diff<30;
  });
  let alertEl=document.getElementById('waterAlert');
  if(cur){
    if(!alertEl){ alertEl=document.createElement('div'); alertEl.className='alert'; alertEl.id='waterAlert'; $('#content').insertBefore(alertEl, $('#content').firstChild); }

    alertEl.innerHTML='💧 该喝水啦！建议 '+cur.amt+'ml · '+cur.note+' <button class="btn" style="padding:4px 12px;margin-left:auto" onclick="document.getElementById(\'waterAlert\').classList.remove(\'show\')">知道了</button>';
  }
}

function timeRender(){
  const p=panel('time');

    '<div class="card">'+
      '<h2>📅 时间记录</h2>'+

        Array.from({length:dim},function(_,i){

        }).join('')+

  $('#sa').onclick=function(){ const time=$('#st').value.trim(), text=$('#sx').value.trim(); if(!text) return; sched[sel]=sched[sel]||[]; sched[sel].push({time:time,text:text}); store.set('sched',sched); timeRender(); };
  const sum=Object.entries(sched).filter(function(pair){ return pair[0].startsWith(y+'-'+String(m+1).padStart(2,'0')); }).map(function(pair){ return {k:pair[0],n:pair[1].length}; });
  const total=sum.reduce(function(s,x){ return s+x.n; },0);

  list.sort(function(a,b){ return b.id.localeCompare(a.id); }).forEach(function(e){

    d.innerHTML='<div class="txt"><span class="tag">'+(e.tag||'其他')+'</span> <b>'+esc(e.title)+'</b><br><span style="font-size:24px;color:var(--brown-soft)">'+esc(e.detail||'')+'</span></div>'+
      '<div class="act"><button class="mini-btn del" data-d="'+e.id+'">删</button></div>';
    wl.appendChild(d);
  });
  wl.querySelectorAll('[data-d]').forEach(function(b){ b.onclick=function(){ evs=evs.filter(function(x){ return x.id!==b.dataset.d; }); store.set('work_evs',evs); workRender(); }; });
  $('#wa').onclick=function(){ const title=$('#wt').value.trim(); if(!title) return; evs.push({id:uid(),date:td,title:title,detail:$('#wd').value.trim(),tag:$('#wtag').value}); store.set('work_evs',evs); workRender(); };
  $('#wfind').onclick=function(){
    const dv=$('#wdate').value; const arr=evs.filter(function(e){ return e.date===dv; });
    const box=$('#wbydate');
    if(!arr.length){ box.innerHTML='<div class="empty">该日无工作记录</div>'; return; }
    box.innerHTML=arr.map(function(e){ return '<div class="item"><div class="txt"><span class="tag">'+(e.tag||'其他')+'</span> <b>'+esc(e.title)+'</b><br><span style="font-size:24px;color:var(--brown-soft)">'+esc(e.detail||'')+'</span></div></div>'; }).join('');
  };
  navBadge('work', list.length);
}

/* ============ 11. 成长资源 ============ */
const GROWTH=[
  {t:'先回应情绪，再处理事情',ex:'同事吐槽项目乱，别急着给方案，先说“听起来确实挺让人头大的”，对方瞬间被接住，后续沟通才顺。'},
  {t:'用“我”代替“你”开头',ex:'把“你总是不回消息”换成“我发消息后有点担心进度，方便时回我一下好吗？”，攻击性瞬间降为零。'},
  {t:'沉默也是一种回应',ex:'对方情绪上头时，你不必立刻接话。安静点头+眼神关注，往往比辩解更有力量。'},
  {t:'具体夸奖比“你好棒”有用',ex:'说“你刚才那个复盘逻辑特别清楚，我一下就懂了”，比泛泛夸奖让人更受用，也更易建立好感。'},
  {t:'提需求时给选择题',ex:'别问“你什么时候有空”，改问“周三还是周五下午对你会方便？”，对方决策成本更低，约成率高。'},
  {t:'拒绝时先肯定再转折',ex:'“这个想法很好，不过我手头排满了，这次可能帮不上，下次提前说我来协调。”既守住边界又不伤情面。'},
  {t:'把“但是”换成“而且”',ex:'“你方案不错，但是预算超了”→“你方案不错，而且我们再把预算压一压就完美了”，听起来像队友而非挑刺。'},
  {t:'重要的事当面/电话说',ex:'容易产生误会的敏感话题，别用文字拉锯。一个3分钟电话，能省掉3天的内心戏。'},
  {t:'会后发一句总结',ex:'“刚才确认了三件事：A归我、B归你、周五对进度。”一句话立住靠谱人设，也防止扯皮。'},
  {t:'允许自己不完美回应',ex:'被冒犯时不必当场漂亮反击。可以说“我需要先消化一下”，给自己留白，反而更从容。'},
  {t:'多问开放式问题',ex:'聊天别只问“吃了吗”，试试“最近有什么让你开心的小事？”，对方更容易打开话匣子。'},
  {t:'承认不知情不可怕',ex:'“这块我不太熟，我查一下回头同步你。”坦诚比硬撑更赢得信任。'},
  {t:'用肢体语言放大善意',ex:'说话时身体微微前倾、放下手机，对方能感到被重视，沟通效率翻倍。'},
  {t:'冲突后主动破冰',ex:'冷战别等对方先低头。一句“昨天我也有点急，咱们翻篇？”往往瞬间化解僵局。'},
  {t:'把功劳分给协作方',ex:'汇报时提一句“多亏XX配合”，你不会被埋没，反而圈粉无数，下次别人也愿意挺你。'}
];
function growRender(){
  const p=panel('grow');
  const d=today(); let h=0; for(const c of d) h=(h*17+c.charCodeAt(0))>>>0;
  const daily=GROWTH[h%GROWTH.length];
  const recent=[];
  for(let i=0;i<5;i++){ const dd=addDays(d,-i); let hh=0; for(const c of dd) hh=(hh*17+c.charCodeAt(0))>>>0; recent.push({dd:dd,t:GROWTH[hh%GROWTH.length]}); }
  p.innerHTML=
    '<div class="card">'+
      '<h2>🌱 成长资源</h2>'+
      '<div class="sub">每日一个女性成长沟通必备小技巧，附实用示例，今天也要悄悄变厉害 💛</div>'+
      '<div class="tip" style="border:2px solid var(--yellow-soft)">'+
        '<div class="day">📅 '+d+' · 今日技巧</div>'+
        '<div class="ttl">💡 '+daily.t+'</div>'+
        '<div class="ex">🗣️ 示例：'+daily.ex+'</div>'+
      '</div>'+
      '<h3>📚 近期回顾</h3>'+
      '<div id="gRecent"></div>'+
    '</div>';
  const gr=$('#gRecent');
  recent.slice(1).forEach(function(r){
    const d0=document.createElement('div'); d0.className='tip';
    d0.innerHTML='<div class="day">'+r.dd+'</div><div class="ttl" style="font-size:20px">'+r.t+'</div><div class="ex">'+r.ex+'</div>';
    gr.appendChild(d0);
  });
  navBadge('grow',0);
}
