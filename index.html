<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>小谢小姐的app 🐤</title>
<meta name="theme-color" content="#FBE7A1" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="小谢小姐" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  :root{
    --bg:#FFFCF5;
    --yellow:#FFD66B;
    --yellow-soft:#FBE7A1;
    --yellow-deep:#F4B740;
    --yellow-cream:#FFF6E0;
    --brown:#7A6A3A;
    --brown-soft:#A99A6C;
    --pink:#FFB3C1;
    --pink-deep:#E75480;
    --green:#9ED79A;
    --red:#FF8A8A;
    --blue:#8FCAE7;
    --card:#FFFFFF;
    --line:#F0E6CC;
    --shadow:0 4px 16px rgba(220,180,60,.14);
    --radius:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--brown);display:flex;overflow:hidden;font-size:17px;}

  .sidebar{
    width:200px;flex-shrink:0;
    background:linear-gradient(180deg,var(--yellow-soft) 0%,var(--yellow-cream) 100%);
    display:flex;flex-direction:column;padding:16px 10px;
    border-right:1px solid var(--line);z-index:5;
  }
  .brand{text-align:center;padding:2px 0 6px;border-bottom:1px dashed var(--line);flex-shrink:0;}
  .brand .logo{font-size:22px;}
  .brand .title{font-weight:800;font-size:12px;color:var(--brown);margin-top:1px;letter-spacing:.5px;}
  .nav{flex:1;overflow:hidden;display:flex;flex-direction:column;}
  .nav::-webkit-scrollbar{width:4px;}
  .nav::-webkit-scrollbar-thumb{background:var(--yellow);border-radius:2px;}
  .nav-item{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    padding:4px 6px;border-radius:14px;cursor:pointer;
    color:var(--brown);font-weight:700;font-size:30px;line-height:1.08;
    transition:all .16s ease;background:transparent;min-height:0;
  }
  .nav-item .ic{font-size:30px;width:32px;text-align:center;flex-shrink:0;line-height:1;}
  .nav-item:hover{background:rgba(255,214,107,.35);}
  .nav-item.active{background:#fff;color:var(--brown);box-shadow:var(--shadow);font-weight:800;border:1px solid var(--yellow-soft);}
  .nav-item .badge{
    margin-left:auto;background:var(--red);color:#fff;font-size:10px;
    min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:700;
  }
  .sidebar .foot{flex-shrink:0;text-align:center;color:var(--brown-soft);font-size:10px;padding:4px 4px 1px;line-height:1.25;}

  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
  .topbar{
    background:var(--card);padding:10px 18px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    box-shadow:0 1px 8px rgba(220,180,60,.1);z-index:4;border-bottom:1px solid var(--line);
  }
  .clock{font-size:23px;font-weight:800;letter-spacing:1px;color:var(--brown);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .clock small{font-size:12px;font-weight:600;color:var(--brown-soft);margin-left:6px;display:block;}
  .quote{flex:1;min-width:180px;background:var(--yellow-cream);border-radius:14px;padding:8px 14px;border-left:4px solid var(--yellow-deep);}
  .quote .cn{font-weight:700;font-size:13px;color:var(--brown);line-height:1.3;}
  .quote .en{font-size:10.5px;color:var(--brown-soft);font-style:italic;margin-top:2px;line-height:1.2;}
  .checkin{
    background:var(--yellow-deep);color:#fff;border:none;border-radius:20px;
    padding:8px 15px;font-weight:700;font-size:20px;cursor:pointer;
    box-shadow:var(--shadow);transition:.18s;display:flex;align-items:center;gap:5px;white-space:nowrap;
  }
  .checkin:hover{transform:scale(1.04);}
  .checkin.done{background:var(--green);}

  .content{flex:1;overflow-y:auto;padding:20px;scroll-behavior:smooth;background:var(--bg);}
  .content > .panel{display:block;max-width:560px;margin:0 auto;}
  .content::-webkit-scrollbar{width:6px;}
  .content::-webkit-scrollbar-thumb{background:var(--yellow);border-radius:3px;}

  .panel{display:none;animation:fade .25s ease;}
  .panel.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  .card{background:var(--card);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:18px;border:1px solid var(--line);}
  .card h2{font-size:28px;margin-bottom:4px;display:flex;align-items:center;gap:8px;color:var(--brown);}
  .card .sub{color:var(--brown-soft);font-size:24px;margin-bottom:16px;line-height:1.6;}
  .card h3{font-size:24px;margin:18px 0 10px;color:var(--yellow-deep);}

  input,textarea,select{
    width:100%;border:1.5px solid var(--line);border-radius:12px;
    padding:12px 14px;font-size:24px;color:var(--brown);background:var(--yellow-cream);
    outline:none;transition:.15s;font-family:inherit;
  }
  input:focus,textarea:focus,select:focus{border-color:var(--yellow-deep);background:#fff;}
  textarea{resize:vertical;min-height:64px;}
  button.btn{
    background:var(--yellow-deep);color:#fff;border:none;border-radius:20px;
    padding:12px 22px;font-weight:700;font-size:24px;cursor:pointer;transition:.15s;
    box-shadow:var(--shadow);white-space:nowrap;
  }
  button.btn:hover{transform:translateY(-1px);filter:brightness(1.04);}
  button.btn.ghost{background:#fff;color:var(--brown);border:1.5px solid var(--line);box-shadow:none;}
  button.btn.pink{background:var(--pink);}
  button.btn.green{background:var(--green);}
  button.btn.red{background:var(--red);}
  button.btn.blue{background:var(--blue);}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;}
  .row > *{flex:0 0 auto;}
  .grow{flex:1 1 120px !important;min-width:120px;}

  .tag{display:inline-block;background:var(--yellow-cream);color:var(--brown);border-radius:12px;padding:3px 10px;font-size:24px;font-weight:700;margin:2px 3px 2px 0;border:1px solid var(--line);}
  .tag.big{font-size:13px;padding:5px 12px;}

  .item{background:var(--yellow-cream);border-radius:12px;padding:13px 15px;margin-bottom:9px;display:flex;align-items:center;gap:10px;border:1.5px solid transparent;}
  .item:hover{border-color:var(--yellow);}
  .item .txt{flex:1;font-size:24px;line-height:1.5;}
  .item.done .txt{text-decoration:line-through;color:var(--brown-soft);}
  .item .act{display:flex;gap:6px;flex-shrink:0;}
  .mini-btn{border:none;background:#fff;border-radius:9px;padding:6px 12px;cursor:pointer;font-size:24px;font-weight:700;color:var(--brown-soft);border:1px solid var(--line);}
  .mini-btn:hover{background:var(--yellow-soft);color:var(--brown);}
  .mini-btn.del{color:var(--red);}
  .mini-btn.del:hover{background:var(--red);color:#fff;border-color:var(--red);}
  .chk{width:21px;height:21px;border-radius:7px;border:2px solid var(--yellow-deep);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex-shrink:0;transition:.15s;}
  .chk.on{background:var(--green);border-color:var(--green);}

  .prio{font-size:11px;font-weight:800;border-radius:8px;padding:2px 7px;flex-shrink:0;}
  .prio.high{background:var(--red);color:#fff;}
  .prio.mid{background:var(--yellow);color:var(--brown);}
  .prio.low{background:#EDE7D6;color:var(--brown-soft);}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0;}
  .stat{background:var(--yellow-cream);border-radius:14px;padding:15px;text-align:center;border:1px solid var(--line);}
  .stat .num{font-size:28px;font-weight:800;color:var(--yellow-deep);}
  .stat .lab{font-size:13px;color:var(--brown-soft);margin-top:3px;}
  .progress{height:10px;background:var(--yellow-cream);border-radius:6px;overflow:hidden;border:1px solid var(--line);}
  .progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--yellow-deep));border-radius:6px;transition:width .4s;}

  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .cal .dow{text-align:center;font-weight:800;font-size:11px;color:var(--brown-soft);padding:3px 0;}
  .cal .cell{
    aspect-ratio:1;border-radius:10px;text-align:center;display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-size:12px;cursor:pointer;background:var(--yellow-cream);
    border:1.5px solid transparent;position:relative;color:var(--brown);
  }
  .cal .cell:hover{border-color:var(--yellow-deep);}
  .cal .cell.today{background:var(--yellow);font-weight:800;}
  .cal .cell.sel{outline:3px solid var(--pink);}
  .cal .cell .dot{width:6px;height:6px;border-radius:50%;background:var(--pink);position:absolute;bottom:4px;}
  .cal .cell .dot.g{background:var(--green);}

  .grid{display:grid;grid-template-columns:1fr;gap:12px;}
  .tile{background:var(--yellow-cream);border-radius:14px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;}
  .tile .thumb{height:120px;background:linear-gradient(135deg,var(--yellow-soft),var(--pink));display:flex;align-items:center;justify-content:center;font-size:40px;}
  .tile .body{padding:14px;flex:1;display:flex;flex-direction:column;gap:7px;}
  /* 每日新闻：3条完整新闻卡片（无跳转） */
  .news-tile{background:#fff;border:1px solid var(--line);}
  .news-tile .body{padding:16px 18px;gap:10px;}
  .nh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .news-tag,.econ-tag{display:inline-block;border-radius:12px;padding:4px 12px;font-size:26px;font-weight:800;}
  .news-tag{background:var(--pink);color:#fff;}
  .econ-tag{background:var(--blue);color:#fff;}
  .nt{font-size:30px;font-weight:800;color:var(--brown);line-height:1.4;}
  .td.full{font-size:28px;line-height:1.8;color:var(--brown-soft);white-space:normal;}
  /* 好好吃饭：详细菜谱卡片 */
  .food-tile .body{padding:16px 18px;gap:8px;}
  .food-tile .thumb{height:120px;background:linear-gradient(135deg,#fff3d6,#ffe0ec);}
  .rc-title{font-size:28px;font-weight:800;color:var(--pink-deep);margin-top:6px;}
  .ings{margin:2px 0 0 0;padding-left:26px;}
  .ings li{font-size:27px;line-height:1.7;color:var(--brown);}
  .steps{margin:2px 0 0 0;padding-left:8px;list-style:none;counter-reset:s;}
  .steps li{font-size:27px;line-height:1.8;color:var(--brown-soft);display:flex;gap:8px;align-items:flex-start;margin-bottom:4px;}
  .step-n{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--pink);color:#fff;font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;}
  .tile .tt{font-weight:800;font-size:16.5px;color:var(--brown);line-height:1.35;}
  .tile .td{font-size:14px;color:var(--brown-soft);line-height:1.5;flex:1;}
  .tile .jump{margin-top:auto;}
  .tile .jump a{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:14px;font-weight:700;color:var(--brown);text-decoration:none;}
  .tile .jump a:hover{background:var(--yellow-soft);}
  .tile .src{font-size:12px;color:var(--brown-soft);background:#fff;border-radius:8px;padding:2px 8px;display:inline-block;margin-bottom:2px;border:1px solid var(--line);}

  .report{background:var(--yellow-cream);border-radius:14px;padding:16px;border-left:4px solid var(--yellow-deep);font-size:24px;line-height:1.8;color:var(--brown);}
  .report h4{color:var(--yellow-deep);margin:12px 0 5px;font-size:24px;}
  .review-list{list-style:none;counter-reset:rv;}
  .review-list li{counter-increment:rv;background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:8px;font-size:24px;line-height:1.6;border:1px solid var(--line);position:relative;padding-left:38px;}
  .review-list li::before{content:counter(rv);position:absolute;left:11px;top:11px;width:20px;height:20px;background:var(--yellow-deep);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
  /* 读书报告模块：整体统一 24px */
  .book-panel h2,.book-panel .sub,.book-panel h3,.book-panel .report,.book-panel .review-list li,.book-panel .bk-author{font-size:24px;}
  .book-panel h2{font-size:24px;}
  .book-panel .sub{font-size:24px;line-height:1.6;}
  .book-panel h3{font-size:24px;}
  .book-panel .report{font-size:24px;line-height:1.8;}
  .book-panel .review-list li{font-size:24px;line-height:1.6;}
  .book-panel .bk-author{font-size:24px;color:var(--brown-soft);margin-top:2px;}
  /* 英语口语模块：整体统一 30px */
  .eng-panel h2,.eng-panel .sub,.eng-panel h3{font-size:30px;}
  .eng-panel h2{font-size:30px;}
  .eng-panel .sub{font-size:30px;line-height:1.6;}
  .eng-panel h3{font-size:30px;}
  .eng-panel #cnbox{font-size:30px;line-height:1.7;}
  .eng-panel .eng-en{font-size:30px;line-height:1.5;}
  .eng-panel .item .txt b{font-size:30px;}
  .eng-panel .item .txt span{font-size:30px;}
  /* 每日穿搭 / 每日新闻 / 好好吃饭：整体统一 30px */
  .fit-panel h2,.news-panel h2,.food-panel h2{font-size:30px;}
  .fit-panel .sub,.news-panel .sub,.food-panel .sub{font-size:30px;line-height:1.6;}
  .fit-panel h3,.news-panel h3,.food-panel h3{font-size:30px;}
  .fit-panel .tt,.news-panel .tt,.food-panel .tt{font-size:30px;}
  .fit-panel .td,.news-panel .td,.food-panel .td{font-size:30px;line-height:1.6;}
  .fit-panel .src,.news-panel .src,.food-panel .src{font-size:26px;}
  .fit-panel .jump a,.news-panel .jump a,.food-panel .jump a{font-size:26px;}
  .fit-panel .item .txt,.news-panel .item .txt,.food-panel .item .txt{font-size:30px;}
  .fit-panel .report,.news-panel .report,.food-panel .report{font-size:30px;line-height:1.8;}
  .fit-panel .report h4,.news-panel .report h4,.food-panel .report h4{font-size:30px;}
  .fit-panel .hint,.news-panel .hint,.food-panel .hint{font-size:26px;}
  .fit-panel .grow,.news-panel .grow,.food-panel .grow{font-size:30px;}
  .fit-panel .btn,.news-panel .btn,.food-panel .btn{font-size:30px;}
  .fit-panel .mini-btn,.news-panel .mini-btn,.food-panel .mini-btn{font-size:26px;}
  .fit-panel .seg button,.news-panel .seg button,.food-panel .seg button{font-size:30px;}
  .fit-panel .empty,.news-panel .empty,.food-panel .empty{font-size:26px;}
  /* 天天喝水 / 时间记录 / 事件记录 / 成长资源：整体统一 30px */
  .water-panel h2,.water-panel .sub,.water-panel h3{font-size:27px;}
  .water-panel .sub{line-height:1.6;}
  .water-panel .stat .num,.water-panel .stat .lab{font-size:27px;}
  .water-panel .water-card .t,.water-panel .water-card .amt,.water-panel .water-card .st{font-size:27px;line-height:1.5;}
  .water-panel .hint{font-size:24px;}
  .time-panel h2,.work-panel h2,.grow-panel h2,
  .time-panel .sub,.work-panel .sub,.grow-panel .sub,
  .time-panel h3,.work-panel h3,.grow-panel h3{font-size:30px;}
  .time-panel .sub,.work-panel .sub,.grow-panel .sub{line-height:1.6;}
  .time-panel .stat .num,.work-panel .stat .num,
  .time-panel .stat .lab,.work-panel .stat .lab{font-size:30px;}
  .time-panel .hint,.work-panel .hint{font-size:26px;}
  .time-panel .pill,.work-panel .pill{font-size:26px;}
  .time-panel .cal .dow,.time-panel .cal .cell,.work-panel .cal .dow,.work-panel .cal .cell{font-size:26px;}
  .time-panel .item .txt,.work-panel .item .txt{font-size:30px;line-height:1.5;}
  .time-panel .item .txt b,.work-panel .item .txt b{font-size:30px;}
  .time-panel .wk-detail,.work-panel .wk-detail{font-size:30px;color:var(--brown-soft);}
  .time-panel .tag,.work-panel .tag{font-size:26px;}
  .time-panel .mini-btn,.work-panel .mini-btn{font-size:26px;}
  .time-panel .btn,.work-panel .btn,.grow-panel .btn{font-size:30px;}
  .time-panel .grow,.work-panel .grow{font-size:30px;}
  .time-panel input,.work-panel input,.time-panel select,.work-panel select{font-size:30px;}
  .time-panel table th,.time-panel table td,.work-panel table th,.work-panel table td{font-size:26px;}
  .time-panel .empty,.work-panel .empty,.grow-panel .empty{font-size:26px;}
  .grow-panel .tip .day,.grow-panel .tip .ttl,.grow-panel .tip .ex{font-size:30px;line-height:1.6;}
  .grow-panel .tip .ttl{font-weight:800;}
  .xhs-tip{font-size:14px;color:var(--brown-soft);background:#fff;border-radius:8px;padding:6px 9px;margin-top:6px;line-height:1.4;border:1px dashed var(--line);}
  .big-tile .thumb{height:200px;display:flex;align-items:center;justify-content:center;background:#fff7e6;border-radius:14px 14px 0 0;}
  .outfit-svg{width:100%;height:200px;display:block;}
  /* 每日穿搭：身材示意 SVG（本地渲染，避免外链图片无法显示） */
  .fig-wrap{display:flex;justify-content:center;margin:10px 0;}
  .body-fig{width:180px;height:288px;border-radius:14px;border:1px solid var(--line);background:#fff7e6;max-width:100%;}
  /* 每日计划：日历与按日查看字号（与计划模块通用体系一致） */
  .plan-panel .cal .dow,.plan-panel .cal .cell{font-size:20px;}
  .plan-panel .cal .cell{aspect-ratio:1;border-radius:10px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:#fff;border:1px solid var(--line);cursor:pointer;font-weight:700;color:var(--brown);}
  .plan-panel .cal .cell:hover{border-color:var(--yellow-deep);}
  .plan-panel .cal .cell.today{background:var(--yellow);}
  .plan-panel .cal .cell.sel{outline:3px solid var(--pink);}
  .plan-panel .cal .cell .dot{width:6px;height:6px;border-radius:50%;background:var(--green);position:absolute;bottom:4px;}

  .water-grid{display:grid;grid-template-columns:1fr;gap:10px;}
  .water-card{background:var(--yellow-cream);border-radius:14px;padding:15px 18px;text-align:left;border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  .water-card .t{font-weight:800;font-size:24px;color:var(--brown);}
  .water-card .amt{font-size:20px;font-weight:800;color:var(--blue);}
  .water-card .st{font-size:13px;color:var(--brown-soft);}
  .water-card.done{background:var(--green);border-color:var(--green);}
  .water-card.done .t,.water-card.done .st{color:#fff;}
  .water-card.done .amt{color:#fff;}

  .alert{background:var(--pink);color:#fff;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:700;margin-bottom:10px;display:none;align-items:center;gap:8px;}
  .alert.show{display:flex;}

  .tip{background:#fff;border-radius:14px;padding:14px;border:1px solid var(--line);margin-bottom:10px;}
  .tip .day{font-size:11px;color:var(--brown-soft);}
  .tip .ttl{font-weight:800;font-size:15px;color:var(--yellow-deep);margin:3px 0 6px;display:flex;align-items:center;gap:6px;}
  .tip .ex{font-size:13px;line-height:1.6;color:var(--brown);background:var(--yellow-cream);border-radius:10px;padding:9px 12px;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(40px);background:var(--brown);color:#fff;padding:11px 20px;border-radius:22px;font-weight:700;opacity:0;transition:.3s;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.2);font-size:13px;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .empty{text-align:center;color:var(--brown-soft);padding:18px;font-size:13px;}
  .pill{font-size:24px;color:var(--brown-soft);background:var(--yellow-cream);border-radius:10px;padding:3px 10px;border:1px solid var(--line);}
  .seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  .seg button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:6px 13px;font-weight:700;cursor:pointer;color:var(--brown-soft);font-size:20px;}
  .seg button.on{background:var(--yellow-deep);color:#fff;border-color:var(--yellow-deep);}

  table{width:100%;border-collapse:collapse;font-size:24px;margin-top:6px;}
  th,td{border:1px solid var(--line);padding:7px;text-align:left;}
  th{background:var(--yellow-cream);}

function $(s){ return document.querySelector(s); }
function $$(s){ return document.querySelectorAll(s); }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function now(){ return new Date(); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove('show'); },1800); }
function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
function weekday(y,m,d){ return '日一二三四五六'[new Date(y,m,d).getDay()]; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

function copyText(txt){

function panel(id){

/* ============ ① 每日计划 ============ */
function planRender(){
  const p=panel('plan');
  let tasks=store.get('tasks',[]);
  const td=today();
  // 查看日期与年月（持久化）
  let sel=store.get('plan_sel', td);
  let ym=store.get('plan_ym', td.slice(0,7));
  const y=Number(ym.slice(0,4)), m=Number(ym.slice(5,7))-1;
  const dim=daysInMonth(y,m);
  // 统计当天任务
  const list=tasks.filter(function(t){ return !t.date || t.date===td; }).sort(function(a,b){ return (b.prio==='high')-(a.prio==='high'); });

  const rate=list.length?Math.round(done/list.length*100):0;
  // 选中日期的任务
  const selTasks=tasks.filter(function(t){ return t.date===sel; }).sort(function(a,b){ return (b.prio==='high')-(a.prio==='high'); });

    '<div class="card plan-panel">'+
      '<h2>📝 每日计划</h2>'+
      '<div class="sub">汇总每日待办，勾选/优先级/编辑/删除，自动统计完成率；并可用日历查看任意一天的计划与完成情况。</div>'+
      '<div class="stat-grid">'+
        '<div class="stat"><div class="num">'+list.length+'</div><div class="lab">今日任务</div></div>'+
        '<div class="stat"><div class="num">'+done+'</div><div class="lab">已完成</div></div>'+
        '<div class="stat"><div class="num">'+rate+'%</div><div class="lab">完成率</div></div>'+
      '</div>'+
      '<div class="progress"><i style="width:'+rate+'%"></i></div>'+
      '<div class="row" style="margin-top:14px">'+
        '<input class="grow" id="nt" placeholder="添加新任务…" />'+
        '<select id="np" style="width:auto">'+
          '<option value="high">🔴 高</option>'+
          '<option value="mid" selected>🟡 中</option>'+
          '<option value="low">⚪ 低</option>'+
        '</select>'+
        '<button class="btn" id="na">添加</button>'+
      '</div>'+
      '<div id="tlist" style="margin-top:10px"></div>'+
      '<h3>📅 按日历查看每日计划</h3>'+
      '<div class="row">'+
        '<div class="pill">'+y+'年'+(m+1)+'月</div>'+

      '</div>'+

        ['日','一','二','三','四','五','六'].map(function(w){ return '<div class="dow">'+w+'</div>'; }).join('')+
        Array.from({length:dim},function(_,i){
          const d=String(i+1).padStart(2,'0'); const key=y+'-'+String(m+1).padStart(2,'0')+'-'+d;
          const has=tasks.some(function(t){ return t.date===key; });
          const isT=key===today(); const isS=key===sel;
          return '<div class="cell '+(isT?'today':'')+' '+(isS?'sel':'')+'" data-d="'+key+'">'+ (i+1) + (has?'<span class="dot g"></span>':'') +'</div>';
        }).join('')+
      '</div>'+
      '<h3 style="margin-top:12px">📌 '+sel+' 的计划（'+selDone+'/'+selTasks.length+' 已完成）</h3>'+
      '<div id="planByDate"></div>'+
    '</div>';
  const tl=$('#tlist');
  if(!list.length){ tl.innerHTML='<div class="empty">还没有任务，添加一条开始吧 🌟</div>'; }
  list.forEach(function(t){
    const d=document.createElement('div'); d.className='item'+(t.done?' done':'');
    const pmap={high:'🔴 高',mid:'🟡 中',low:'⚪ 低'};
    d.innerHTML='<div class="chk '+(t.done?'on':'')+'" data-i="'+t.id+'">'+(t.done?'✓':'')+'</div>'+
      '<div class="prio '+(t.prio||'mid')+'">'+pmap[t.prio||'mid']+'</div>'+
      '<div class="txt">'+esc(t.text)+'</div>'+
      '<div class="act"><button class="mini-btn" data-e="'+t.id+'">编辑</button><button class="mini-btn del" data-d="'+t.id+'">删除</button></div>';
    tl.appendChild(d);
  });
  tl.querySelectorAll('.chk').forEach(function(c){ c.onclick=function(){ const t=tasks.find(function(x){ return x.id===c.dataset.i; }); t.done=!t.done; store.set('tasks',tasks); planRender(); }; });
  tl.querySelectorAll('[data-d]').forEach(function(b){ b.onclick=function(){ tasks=tasks.filter(function(x){ return x.id!==b.dataset.d; }); store.set('tasks',tasks); planRender(); }; });
  tl.querySelectorAll('[data-e]').forEach(function(b){ b.onclick=function(){ const t=tasks.find(function(x){ return x.id===b.dataset.d; }); const nv=prompt('编辑任务：',t.text); if(nv!==null&&nv.trim()){ t.text=nv.trim(); store.set('tasks',tasks); planRender(); } }; });
  $('#na').onclick=function(){ const v=$('#nt').value.trim(); if(!v) return; tasks.push({id:uid(),text:v,prio:$('#np').value,done:false,date:td}); store.set('tasks',tasks); planRender(); };
  $('#nt').onkeydown=function(e){ if(e.key==='Enter') $('#na').click(); };
  // 选中日期的任务展示
  const pb=$('#planByDate');
  if(!selTasks.length){ pb.innerHTML='<div class="empty">这一天还没有计划记录</div>'; }
  selTasks.forEach(function(t){
    const d=document.createElement('div'); d.className='item'+(t.done?' done':'');
    const pmap={high:'🔴 高',mid:'🟡 中',low:'⚪ 低'};
    d.innerHTML='<div class="chk '+(t.done?'on':'')+'">'+(t.done?'✓':'')+'</div>'+
      '<div class="prio '+(t.prio||'mid')+'">'+pmap[t.prio||'mid']+'</div>'+
      '<div class="txt">'+esc(t.text)+'</div>'+
      '<div class="act"><span class="mini-btn" style="cursor:default">'+ (t.done?'✅已完成':'⬜未完成') +'</span></div>';
    pb.appendChild(d);
  });
  // 日历交互
  p.querySelectorAll('.cal .cell').forEach(function(c){ c.onclick=function(){ store.set('plan_sel',c.dataset.d); planRender(); }; });
  $('#prevPM').onclick=function(){ const nd=new Date(y,m-1,1); store.set('plan_ym',nd.getFullYear()+'-'+String(nd.getMonth()+1).padStart(2,'0')); planRender(); };
  $('#nextPM').onclick=function(){ const nd=new Date(y,m+1,1); store.set('plan_ym',nd.getFullYear()+'-'+String(nd.getMonth()+1).padStart(2,'0')); planRender(); };
  navBadge('plan', list.filter(function(t){ return !t.done; }).length);
}

  $('#speak').onclick=function(){ speak(sp.en); };
  $('#shadow').onclick=function(){
    const tip=$('#shadowTip'); tip.style.display='block';

    speak(sp.en);
    setTimeout(function(){ tip.textContent='👄 现在跟着念出来（影子跟读）…'; },2600);
    setTimeout(function(){ tip.textContent='👄 第 2 遍：再听一次对照自己的发音'; },4200);
    setTimeout(function(){
      tip.textContent='✅ 影子跟读完成，已打卡！累计 '+(r.shadow.count+1)+' 次';
      r.shadow.count=r.shadow.count+1; r.shadow.last=today();
      rec[key]=r; store.set('eng_rec',rec);
      if(!tasks.find(function(t){ return t.en===sp.en; })){
        const stage=Math.min(r.stage+1,4);
        tasks.push({id:uid(),en:sp.en,next:addDays(today(),EB[stage]||30)});
        store.set('eng_tasks',tasks);
      }
      setTimeout(engRender,1200);
    },6400);
  };
  // 录音跟读
  let mediaRec=null, recChunks=[], recStream=null;
  $('#recStart').onclick=function(){
    const self=this;
    if(!navigator.mediaDevices || !window.MediaRecorder){ toast('当前浏览器不支持录音'); return; }
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      recStream=stream; recChunks=[];
      mediaRec=new MediaRecorder(stream);
      mediaRec.ondataavailable=function(e){ if(e.data.size>0) recChunks.push(e.data); };
      mediaRec.onstop=function(){
        const blob=new Blob(recChunks,{type:mediaRec.mimeType||'audio/webm'});
        const url=URL.createObjectURL(blob);
        $('#audioBox').innerHTML='<div style="color:var(--brown-soft);margin-bottom:4px">🔁 你的跟读录音：</div><audio controls src="'+url+'"></audio>';
        stream.getTracks().forEach(function(t){ t.stop(); });
        // 录音完成也算一次影子跟读打卡
        r.shadow.count=r.shadow.count+1; r.shadow.last=today();
        rec[key]=r; store.set('eng_rec',rec);
        $('#shadowTip').style.display='block';
        $('#shadowTip').textContent='✅ 录音跟读完成，已打卡！累计 '+r.shadow.count+' 次';
        if(!tasks.find(function(t){ return t.en===sp.en; })){
          const stage=Math.min(r.stage+1,4);
          tasks.push({id:uid(),en:sp.en,next:addDays(today(),EB[stage]||30)});
          store.set('eng_tasks',tasks);
        }
      };
      mediaRec.start();
      self.style.display='none'; $('#recStop').style.display='inline-block';
      toast('录音中，跟读吧 🎙️');
    }).catch(function(){ toast('无法访问麦克风，请检查权限'); });
  };
  $('#recStop').onclick=function(){
    if(mediaRec && mediaRec.state!=='inactive') mediaRec.stop();
    this.style.display='none'; $('#recStart').style.display='inline-block';
  };
  $('#review').onclick=function(){
    const stage=Math.min(r.stage+1,4);
    r.stage=stage; r.next=addDays(today(),EB[stage]||30); r.last=today();
    rec[key]=r; store.set('eng_rec',rec);
    if(!tasks.find(function(t){ return t.en===sp.en; })){ tasks.push({id:uid(),en:sp.en,next:r.next}); store.set('eng_tasks',tasks); }
    toast('已安排下次复习：'+r.next+' 💡'); engRender();
  };
  $('#goRecite').onclick=function(){ engReciteView(); };
  navBadge('eng', learn.length);
}

  if(!rec[key].recite) rec[key].recite={count:0,last:''};

    '<div class="card eng-panel">'+
      '<h2>✍️ 背诵默写打卡</h2>'+
      '<div class="sub">先隐藏原文，凭记忆默写出这句英文，提交后自动比对判分；默写正确即可打卡。</div>'+

        '<div style="font-weight:800;color:var(--blue);margin-bottom:8px">📝 今日默写：'+esc(sp.type)+' · '+esc(sp.src)+'</div>'+
        '<div class="row" style="flex-wrap:wrap;margin-bottom:8px">'+
          '<button class="btn" id="toggleEn">👁️ 隐藏/显示原文</button>'+
          '<button class="btn" id="toggleCn">👁️ 隐藏/显示中文</button>'+
        '</div>'+
        '<div id="enbox" class="eng-en" style="font-weight:800;color:var(--brown);margin-bottom:8px">'+esc(sp.en)+'</div>'+
        '<div id="cnbox" style="color:var(--brown-soft);margin-bottom:8px">'+esc(sp.cn)+'</div>'+
        '<textarea id="dictInput" placeholder="在此默写出英文…" style="width:100%;min-height:90px;font-size:30px;padding:10px;border-radius:12px;border:2px solid var(--line);font-family:inherit;resize:vertical"></textarea>'+
        '<div class="row" style="margin-top:8px;flex-wrap:wrap">'+
          '<button class="btn blue" id="check">🔍 提交判分</button>'+
          '<button class="btn" id="showAns">💡 看答案</button>'+
          '<button class="btn green" id="recite" style="display:none">✅ 打卡（默写正确）</button>'+
        '</div>'+
        '<div id="dictResult" style="margin-top:8px;font-weight:700;display:none"></div>'+
        '<div id="reciteTip" style="margin-top:8px;color:var(--blue);font-weight:700;display:none"></div>'+
      '</div>'+
      '<div class="row" style="margin-top:6px">'+
        '<button class="btn" id="backEng" style="width:100%;justify-content:center">⬅️ 返回「英语口语·跟读」</button>'+
      '</div>'+
    '</div>';
  let enHidden=false, cnHidden=false;
  $('#toggleEn').onclick=function(){
    enHidden=!enHidden;
    $('#enbox').style.display=enHidden?'none':'block';
    this.textContent=enHidden?'👁️ 显示原文':'👁️ 隐藏/显示原文';
  };
  $('#toggleCn').onclick=function(){
    cnHidden=!cnHidden;
    $('#cnbox').style.display=cnHidden?'none':'block';
    this.textContent=cnHidden?'👁️ 显示中文':'👁️ 隐藏/显示中文';
  };
  $('#check').onclick=function(){
    const val=$('#dictInput').value;
    const res=$('#dictResult');
    if(!val.trim()){ res.style.display='block'; res.style.color='var(--red)'; res.textContent='✍️ 先写出你的默写再提交哦'; return; }
    const ok=norm(val)===norm(sp.en);
    res.style.display='block';
    if(ok){
      res.style.color='var(--green)';
      res.textContent='🎉 完全正确！可以打卡啦';
      $('#recite').style.display='inline-block';
      r.recite.count=r.recite.count+1; r.recite.last=today();
      rec[key]=r; store.set('eng_rec',rec);
      const tip=$('#reciteTip'); tip.style.display='block';
      tip.textContent='📝 已打卡！累计背诵 '+r.recite.count+' 次（'+r.recite.last+'）';
      toast('背诵默写打卡 +1 ✅');
    } else {
      res.style.color='var(--red)';
      const u=val.split(/\s+/), a=sp.en.split(/\s+/);
      let wrong=0; for(let i=0;i<Math.max(u.length,a.length);i++){ if(norm(u[i]||'')!==norm(a[i]||'')) wrong++; }
      res.textContent='❌ 有 '+wrong+' 处不一致，对照原文再练练～ 点「看答案」核对';
    }
  };
  $('#showAns').onclick=function(){
    $('#enbox').style.display='block'; enHidden=false; $('#toggleEn').textContent='👁️ 隐藏/显示原文';

  };

    tip.textContent='📝 已打卡！累计背诵 '+r.recite.count+' 次（'+r.recite.last+'）';
    toast('背诵默写打卡 +1 ✅');
  };
  $('#backEng').onclick=function(){ engRender(); };
  navBadge('eng', 0);
}

/* ============ ③ 记账存钱 ============ */
function moneyRender(){
  const p=panel('money');
  const BUDGET=1000;
  const ym=today().slice(0,7);
  let exp=store.get('exp',[]);
  const me=exp.filter(function(e){ return e.date.slice(0,7)===ym; });
  const spent=me.reduce(function(s,e){ return s+Number(e.amt||0); },0);
  const left=BUDGET-spent;
  const big=me.filter(function(e){ return e.big; }).reduce(function(s,e){ return s+Number(e.amt||0); },0);
  const unneed=me.filter(function(e){ return !e.need; }).reduce(function(s,e){ return s+Number(e.amt||0); },0);
  p.innerHTML=
    '<div class="card">'+
      '<h2>💰 记账存钱</h2>'+
      '<div class="sub">月度预算 1000 元 · 记录每日开支，自动呈现目标结余，标注大额与不必要的开支。</div>'+
      '<div class="stat-grid">'+
        '<div class="stat"><div class="num">¥'+BUDGET+'</div><div class="lab">本月预算</div></div>'+
        '<div class="stat"><div class="num">¥'+spent+'</div><div class="lab">已花费</div></div>'+
        '<div class="stat"><div class="num" style="color:'+(left<0?'var(--red)':'var(--green)')+'">¥'+left+'</div><div class="lab">目标结余</div></div>'+
        '<div class="stat"><div class="num" style="color:var(--red)">¥'+unneed+'</div><div class="lab">不必要开支</div></div>'+
      '</div>'+
      '<div class="hint">本月大额开支合计：<b>¥'+big+'</b>（标记为 🔴 大额的项）。节省不必要开支可让结余更充裕～</div>'+
      '<div class="row" style="margin-top:10px">'+
        '<input class="grow" id="ec" placeholder="类别，如 午餐/交通" />'+
        '<input id="ea" placeholder="金额" style="width:90px" inputmode="decimal" />'+
      '</div>'+
      '<div class="row">'+
        '<label class="tag"><input type="checkbox" id="ebig" style="width:auto;margin-right:4px">🔴 大额开支</label>'+
        '<label class="tag"><input type="checkbox" id="eun" style="width:auto;margin-right:4px" checked>✅ 必要开支</label>'+
        '<button class="btn" id="ea2" style="margin-left:auto">记一笔</button>'+
      '</div>'+
      '<div id="elist" style="margin-top:10px"></div>'+
    '</div>';
  const el=$('#elist');
  if(!me.length){ el.innerHTML='<div class="empty">本月还没有记录，记下第一笔吧 💛</div>'; }
  me.sort(function(a,b){ return b.date.localeCompare(a.date); }).forEach(function(e){
    const d=document.createElement('div'); d.className='item';
    d.innerHTML='<div class="txt"><b>'+esc(e.cat)+'</b> <span class="pill">'+e.date.slice(5)+'</span> '+(e.note?esc(e.note):'')+
        (e.big?'<span class="tag" style="background:var(--red);color:#fff">大额</span>':'')+
        (!e.need?'<span class="tag" style="background:#EDE7D6;color:var(--brown-soft)">不必要</span>':'')+'</div>'+
      '<div style="font-weight:800;color:var(--brown)">¥'+Number(e.amt).toFixed(0)+'</div>'+
      '<div class="act"><button class="mini-btn del" data-d="'+e.id+'">删</button></div>';
    el.appendChild(d);
  });
  el.querySelectorAll('[data-d]').forEach(function(b){ b.onclick=function(){ exp=exp.filter(function(x){ return x.id!==b.dataset.d; }); store.set('exp',exp); moneyRender(); }; });
  $('#ea2').onclick=function(){
    const cat=$('#ec').value.trim(); const amt=parseFloat($('#ea').value);
    if(!cat||isNaN(amt)){ toast('请填类别和金额'); return; }
    exp.push({id:uid(),date:today(),cat:cat,amt:amt,note:'',big:$('#ebig').checked,need:!$('#eun').checked});
    store.set('exp',exp); moneyRender();
  };
}

   report:'《非暴力沟通》提出一套人人能学会的四步法：观察、感受、需要、请求。卢森堡博士认为，我们平时习以为常的沟通，大多披着爱的外衣行暴力之实——道德评判、进行比较、回避责任、强人所难，这四种异化沟通让亲密关系遍体鳞伤。书中用大量真实调解案例说明：冲突的根源很少是立场对立，而是双方都未被看见的需要。当你脱口而出你从不陪我，对方听到的全是指责，于是防御、反击。若换成这周你有三天晚归，我感到孤单，因为我需要陪伴，能否周末一起吃饭，沟通才有成立的可能。这里的关键是区分观察与评论：观察是镜头里的事实，评论是带着标签的判断。说小张迟到了三次是观察，说小张不负责是评论。感受也不是想法，我很失落是感受，我觉得被忽视是想法。需要更不是策略，需要是人人共有的底层渴望：被尊重、被理解、有安全感。请求则要具体、可行，而非含糊的命令。这本书远不止话术，它背后是一种把人当人的世界观：相信每个行为背后都有善意的需要。当你能听见对方愤怒下的恐惧，听见自己指责里的渴望，许多对抗自然消融。它适合所有在关系里总是受伤或总是伤人的人，也特别适合父母和伴侣。读完会减少大量无谓的争吵，把能量留给真正重要的事。实践非暴力沟通最难的，不是记住四步，而是先按下情绪暂停键。人在被激怒的瞬间，本能是反击，这时候说出的话多半是评判和命令。书里建议，先在心里默数三秒，问自己此刻我真正需要什么。一旦你能命名自己的需要，语言就会从攻击变成邀请。另一个常见误区是，把请求说成要求：如果你不怎样，我就怎样，这仍是暴力。真正的请求留有余地，对方可以拒绝。卢森堡还提醒，对自己也要非暴力——我们常对自己说你怎么这么笨，这同样是异化沟通。试着把自责换成观察与需要：我这次没做好，因为我需要被认可，下次可以提前准备。当内外都用同一种善意语言，人的内耗会大幅降低。这本书值得贴在冰箱上、存进手机备忘录，在每一次想发火的关口，拿出来照做一遍。',
   reviews:['四步法真的能救婚姻。','你从不 是沟通毒药，书里点醒了。','先说感受再说道理，亲测有效。','育儿用书，孩子不再对抗。','把评判换成观察，世界都温柔了。','需要不是弱点，是人之常情。','职场甩锅时，这本书让你冷静。','请求不等于命令，一字之差天壤之别。','适合所有不会吵架的人。','读完减少了80%的家庭矛盾。']},
  {t:'蛤蟆先生去看心理医生',a:'罗伯特·戴博德',emoji:'📔',
   report:'《蛤蟆先生去看心理医生》借《柳林风声》的角色，把十次心理咨询写成了一则温柔的童话。蛤蟆原本光鲜却突然抑郁，在苍鹭医生的引导下，他第一次认识了自己的人格结构：儿童自我状态、父母自我状态、成人自我状态。我们每个人都带着童年形成的模式活着——要么缩在儿童状态里被情绪淹没，要么躲进父母状态去审判他人或自己，唯有成人状态才能理性、负责地回应当下。书中最扎心的洞察是：蛤蟆一直处在适应型儿童模式里讨好别人，又用挑剔型父母攻击自己。他以为不快乐是父母造成的，但苍鹭告诉他，折磨你的不是过去，而是你持续选择的态度。治愈的起点，是停止向外 blaming，为自己的人生负起责任。只有当蛤蟆说出我该为自己的情绪负责，他才真正长大。这本书是心理学入门最柔软的敲门砖：不吓人、不学术、没有诊断术语，却把移情、自我觉察、心理断奶这些硬核概念，融进了一只蛤蟆的流泪与释然。它让害怕做咨询的人知道，心理咨询不是被审视，而是有人陪你，把乱成一团的内心重新理顺。适合想了解自己却不敢翻开厚厚教科书的人，也适合正陪身边人走过情绪低谷的你。读完会想给那个一直讨好的自己，一个拥抱。书中把抑郁的成因讲得很清楚：当我们长期活在父母状态的挑剔里，或儿童状态的讨好里，成人状态就被压抑，人就会像泄了气的蛤蟆，提不起劲。苍鹭反复追问是谁在为你负责，逼着蛤蟆从受害者心态里走出来。这个过程很痛，因为承认自己有选择，就意味着不能再怪别人。但正是这份痛，带来了真正的自由。书里还点出情绪是信使：蛤蟆的哭泣不是软弱，而是积压已久的委屈在释放。许多从小被教育不许哭的人，最需要学会的恰恰是允许自己难过。读完这本书，你会更懂身边情绪低落的朋友——他们不是矫情，而是卡在了某个旧模式里。与其说教，不如像苍鹭那样，安静地陪伴、适时地提问，让他们自己找到答案。它也是给为人父母者的提醒：你随口的一句否定，可能在一个孩子心里，筑起三十年的堤坝。',
   reviews:['心理咨询原来长这样，没那么可怕。','儿童/父母/成人 三状态太好用了。','我好像一直在讨好型人格里。','比看心理学科普书轻松多了。','蛤蟆就是我，泪目。','为自己负责 四个字值回书价。','适合想做咨询又害怕的人先读。','苍鹭医生的话句句扎心。','轻松读懂童年如何影响现在。','治愈系心理学天花板。']},
  {t:'认知觉醒',a:'周岭',emoji:'📕',
   report:'《认知觉醒》是本土作者周岭写给普通人的成长笔记，用元认知这根线，把习惯、专注、学习、情绪串成一套可操作的体系。全书最重要的判断是：人与人的根本差距，不在努力程度，而在认知层次。很多人用战术勤奋掩盖战略懒惰，本质是看不见自己的思维盲区。书中最实用的工具是舒适区边缘理论：成长发生在拉伸区，而非舒适区或恐慌区。每天做一点有点难但够得着的事，比咬牙硬撑更有效。周岭拆解了早冥读写跑五件套——早起、冥想、读书、写作、跑步，不是要你全做，而是用微小习惯撬动自律。他特别讲透元认知：它像大脑里的另一个我，能在你本能想刷手机时，跳出来问一句，这真是你现在该做的吗。对焦虑，作者给的解药是消除模糊——把模糊的目标量化、把担忧写下来，焦虑就失去根基。他还提醒警惕打卡陷阱：别让记录变成表演，让习惯服务于成长而非虚荣。全书不灌鸡汤，更像一份思维导图式的行动手册。它适合所有想改变却总在重启的人，尤其焦虑的打工人。读完最大的收获，不是懂了多少概念，而是开始写反思日记、开始凭感觉找方向。成长不是忽然蜕变，而是每天清醒一点点的复利。周岭在书里反复强调一个反直觉的真相：成长不是靠意志力硬扛，而是靠认知升级后的自然选择。很多人制定宏大的年计划，三天就废，因为目标在恐慌区，大脑本能抗拒。正确的做法是把目标拆到拉伸区边缘，让每一次行动都带着轻微的挑战感和即时的反馈。他还提出元时间概念：每天里那些你本可以做更好选择的瞬间，就是元时间，抓住它们，人生走向就会不同。关于学习，他推崇深度专注：一次只做一件事，进入心流，超越多线程更高效。情绪管理上，他建议把焦虑写下来，外化之后它就不再是混沌的怪物。这本书最动人的地方，是作者把自己从混沌到清醒的真实轨迹摊开给你看，让你相信普通人也能靠认知迭代翻身。建议搭配一本随手笔记，边读边记录自己当下的模糊点，读完后行动，而非收藏。成长没有捷径，但认知觉醒，是离捷径最近的那条路。',
   reviews:['舒适区边缘 让我停止过度自责。','元认知这个概念彻底改变了我。','早冥读写跑，照做一个月有变化。','比很多外国自律书更接地气。','消除模糊等于消除焦虑，认同。','打卡陷阱那段太真实。','本土成长书里的清流。','凭感觉找方向，亲测有用。','适合焦虑的打工人。','读完开始写反思日记了。']},

/* ============ ⑤ 天天喝水 ============ */
const WATER_PLAN=[
  {t:'07:30 起床',amt:200,note:'温水唤醒身体'},
  {t:'09:30 上午',amt:250,note:'工作间隙'},
  {t:'11:30 午前',amt:200,note:'餐前一杯'},
  {t:'13:30 午后',amt:250,note:'防困补水'},
  {t:'15:30 下午',amt:200,note:'提神'},
  {t:'17:30 傍晚',amt:250,note:'运动前'},
  {t:'19:30 晚间',amt:200,note:'餐后'},
  {t:'21:00 睡前',amt:150,note:'小口慢饮'}
];
function waterRender(){
  const p=panel('water');
  let w=store.get('water',{});
  const td=today(); const done=w[td]||[];
  const total=WATER_PLAN.reduce(function(s,x){ return s+x.amt; },0);
  const got=done.reduce(function(s,i){ return s+WATER_PLAN[i].amt; },0);
  p.innerHTML=
    '<div class="card water-panel">'+
      '<h2>💧 天天喝水</h2>'+
      '<div class="sub">内置标准喝水时间表，标注建议饮水量，勾选完成即可。建议每日总量约 '+total+' ml。</div>'+
      '<div class="stat-grid">'+
        '<div class="stat"><div class="num">'+done.length+'/'+WATER_PLAN.length+'</div><div class="lab">已喝次数</div></div>'+
        '<div class="stat"><div class="num">'+got+'ml</div><div class="lab">已摄入</div></div>'+
        '<div class="stat"><div class="num">'+(total-got>0?total-got:0)+'ml</div><div class="lab">还差</div></div>'+
      '</div>'+
      '<div class="progress"><i style="width:'+Math.round(got/total*100)+'%"></i></div>'+
      '<div class="water-grid" style="margin-top:14px" id="wg"></div>'+
      '<div class="hint">💡 小贴士：每次喝 200ml 左右、小口慢饮更易吸收。前台打开本页时，到点会有提醒条弹出。</div>'+
    '</div>';
  const wg=$('#wg');
  WATER_PLAN.forEach(function(x,i){
    const d=document.createElement('div'); d.className='water-card'+(done.includes(i)?' done':'');
    d.innerHTML='<div class="t">'+x.t+'</div><div class="amt">'+x.amt+'ml</div><div class="st">'+(done.includes(i)?'✅ 已喝':'待喝')+' · '+x.note+'</div>';
    d.onclick=function(){
      let arr=w[td]||[];
      if(arr.includes(i)) arr=arr.filter(function(j){ return j!==i; }); else arr.push(i);
      w[td]=arr; store.set('water',w); waterRender();
    };
    wg.appendChild(d);
  });
  navBadge('water', WATER_PLAN.length-done.length);
}
function waterAlert(){
  const nowMin=new Date().getHours()*60+new Date().getMinutes();
  const cur=WATER_PLAN.find(function(x){
    const parts=x.t.split(' ')[0].split(':'); const h=Number(parts[0]); const m=Number(parts[1]);
    const diff=nowMin-(h*60+m); return diff>=0 && diff<30;
  });
  let alertEl=document.getElementById('waterAlert');
  if(cur){
    if(!alertEl){ alertEl=document.createElement('div'); alertEl.className='alert'; alertEl.id='waterAlert'; $('#content').insertBefore(alertEl, $('#content').firstChild); }
    alertEl.className='alert show';
    alertEl.innerHTML='💧 该喝水啦！建议 '+cur.amt+'ml · '+cur.note+' <button class="btn" style="padding:4px 12px;margin-left:auto" onclick="document.getElementById(\'waterAlert\').classList.remove(\'show\')">知道了</button>';
  }
}

  {meal:'晚餐',t:'番茄豆腐汤+花卷',emoji:'🍅',kcal:310,
   ings:['番茄 2个','嫩豆腐 150g','鸡蛋 1个','花卷 1个','葱花 适量'],
   steps:['番茄切块炒出汁，加水煮开。','放豆腐块煮3分钟，淋蛋液成蛋花。','撒葱花加盐，配花卷。','酸甜暖身的家常汤。']},
  {meal:'晚餐',t:'凉拌黄瓜木耳+玉米',emoji:'🌽',kcal:290,
   ings:['黄瓜 1根','干木耳 10g','蒜末 适量','玉米 1根','醋/生抽 适量'],
   steps:['木耳泡发焯水3分钟过凉，黄瓜拍碎切段。','蒜末醋生抽调汁拌匀冷藏。','玉米煮熟掰段。','凉菜配粗粮，低卡有饱腹感。']}
];
function foodRender(){
  const p=panel('food');
  const td=today();
  let fh=0; for(const c of td) fh=(fh*31+c.charCodeAt(0))>>>0;
  const lunch=FOODS.filter(function(f){ return f.meal==='午餐'; });
  const dinner=FOODS.filter(function(f){ return f.meal==='晚餐'; });
  const pickL=lunch[(fh)%lunch.length];
  const pickD=dinner[(fh>>3)%dinner.length];
  const todayFoods=[pickL,pickD];
  p.innerHTML=
    '<div class="card food-panel">'+
      '<h2>🍱 好好吃饭</h2>'+
      '<div class="sub">每日减脂家常菜：自动更新一道午餐 + 一道晚餐，附完整食材用量与步骤，照着做就能吃。</div>'+
      '<div class="seg" id="fseg">'+
        '<button class="on" data-f="all">今日全部</button>'+
        '<button data-f="午餐">今日午餐</button>'+
        '<button data-f="晚餐">今日晚餐</button>'+
      '</div>'+
      '<div class="grid" id="fg"></div>'+
    '</div>';
  const fg=$('#fg'); let flt='all';
  function draw(){
    fg.innerHTML='';
    todayFoods.filter(function(f){ return flt==='all'||f.meal===flt; }).forEach(function(f){
      const ings=f.ings.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('');
      const steps=f.steps.map(function(x,i){ return '<li><span class="step-n">'+(i+1)+'</span>'+esc(x)+'</li>'; }).join('');
      const d=document.createElement('div'); d.className='tile food-tile';
      d.innerHTML='<div class="thumb">'+f.emoji+'</div><div class="body">'+
        '<span class="src">'+f.meal+' · 约'+f.kcal+'kcal · 每日更新</span>'+
        '<div class="tt">'+f.t+'</div>'+
        '<div class="rc-title">🧺 食材与用量</div>'+
        '<ul class="ings">'+ings+'</ul>'+
        '<div class="rc-title">👩‍🍳 做法步骤</div>'+
        '<ol class="steps">'+steps+'</ol>'+
      '</div>';
      fg.appendChild(d);
    });
  }
  draw();
  $('#fseg').querySelectorAll('button').forEach(function(b){ b.onclick=function(){ $('#fseg').querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); }); b.classList.add('on'); flt=b.dataset.f; draw(); }; });
  navBadge('food',0);
}

/* ============ ⑨ 时间记录 ============ */
function timeRender(){
  const p=panel('time');
  const y=now().getFullYear(), m=now().getMonth();
  let sched=store.get('sched',{});
  let sel=store.get('time_sel',today());
  const dim=daysInMonth(y,m);
  const data=sched[sel]||[];
  p.innerHTML=
    '<div class="card time-panel">'+
      '<h2>📅 时间记录</h2>'+
      '<div class="sub">日历记录上课/日程时间，按日期手动编辑，每月自动汇总。</div>'+
      '<div class="row">'+
        '<div class="pill">'+y+'年'+(m+1)+'月</div>'+
        '<button class="btn ghost" id="prevM" style="margin-left:auto">◀</button>'+
        '<button class="btn ghost" id="nextM">▶</button>'+
      '</div>'+
      '<div class="cal" style="margin-top:8px">'+
        ['日','一','二','三','四','五','六'].map(function(w){ return '<div class="dow">'+w+'</div>'; }).join('')+
        Array.from({length:dim},function(_,i){
          const d=String(i+1).padStart(2,'0'); const key=y+'-'+String(m+1).padStart(2,'0')+'-'+d;
          const has=sched[key]&&sched[key].length; const isT=key===today(); const isS=key===sel;
          return '<div class="cell '+(isT?'today':'')+' '+(isS?'sel':'')+'" data-d="'+key+'">'+ (i+1) + (has?'<span class="dot g"></span>':'') +'</div>';
        }).join('')+
      '</div>'+
      '<h3>📌 '+sel+' 的安排</h3>'+
      '<div id="schedList"></div>'+
      '<div class="row" style="margin-top:8px">'+
        '<input id="st" placeholder="时间 如 14:00" style="width:90px" />'+
        '<input class="grow" id="sx" placeholder="内容 如 英语课" />'+
        '<button class="btn" id="sa">添加</button>'+
      '</div>'+
    '</div>'+
    '<div class="card time-panel">'+
      '<h2>📊 本月汇总</h2>'+
      '<div id="monthSum"></div>'+
    '</div>';
  const sl=$('#schedList');
  if(!data.length) sl.innerHTML='<div class="empty">这天还没有安排</div>';
  data.forEach(function(s,i){
    const d=document.createElement('div'); d.className='item';
    d.innerHTML='<div class="pill">'+s.time+'</div><div class="txt">'+esc(s.text)+'</div><div class="act"><button class="mini-btn del" data-d="'+i+'">删</button></div>';
    sl.appendChild(d);
  });
  sl.querySelectorAll('[data-d]').forEach(function(b){ b.onclick=function(){ const arr=sched[sel]||[]; arr.splice(b.dataset.d,1); if(!arr.length) delete sched[sel]; store.set('sched',sched); timeRender(); }; });
  $('#sa').onclick=function(){ const time=$('#st').value.trim(), text=$('#sx').value.trim(); if(!text) return; sched[sel]=sched[sel]||[]; sched[sel].push({time:time,text:text}); store.set('sched',sched); timeRender(); };
  const sum=Object.entries(sched).filter(function(pair){ return pair[0].startsWith(y+'-'+String(m+1).padStart(2,'0')); }).map(function(pair){ return {k:pair[0],n:pair[1].length}; });
  const total=sum.reduce(function(s,x){ return s+x.n; },0);
  $('#monthSum').innerHTML='<div class="stat-grid">'+
      '<div class="stat"><div class="num">'+sum.length+'</div><div class="lab">有安排天数</div></div>'+
      '<div class="stat"><div class="num">'+total+'</div><div class="lab">总事项</div></div>'+
    '</div>'+
    (sum.length?'<table><tr><th>日期</th><th>事项数</th></tr>'+sum.map(function(x){ return '<tr><td>'+x.k.slice(5)+'</td><td>'+x.n+'</td></tr>'; }).join('')+'</table>':'<div class="empty">本月暂无记录</div>');
  p.querySelectorAll('.cal .cell').forEach(function(c){ c.onclick=function(){ store.set('time_sel',c.dataset.d); timeRender(); }; });
  $('#prevM').onclick=function(){ const nd=new Date(y,m-1,1); store.set('time_sel',nd.getFullYear()+'-'+String(nd.getMonth()+1).padStart(2,'0')+'-01'); timeRender(); };
  $('#nextM').onclick=function(){ const nd=new Date(y,m+1,1); store.set('time_sel',nd.getFullYear()+'-'+String(nd.getMonth()+1).padStart(2,'0')+'-01'); timeRender(); };
  navBadge('time',0);
}

/* ============ ⑩ 事件记录(工作) ============ */
function workRender(){
  const p=panel('work');
  let evs=store.get('work_evs',[]);
  const td=today();
  const list=evs.filter(function(e){ return e.date===td; });
  p.innerHTML=
    '<div class="card work-panel">'+
      '<h2>💼 事件记录（工作）</h2>'+
      '<div class="sub">工作留痕，按日期记录，可结合日历随时回溯。</div>'+
      '<div class="row"><input id="wt" class="grow" placeholder="事件标题，如 完成周报" /></div>'+
      '<div class="row">'+
        '<select id="wtag" style="width:auto"><option value="会议">📋 会议</option><option value="产出">✅ 产出</option><option value="沟通">💬 沟通</option><option value="">📌 其他</option></select>'+
        '<input id="wd" class="grow" placeholder="细节/留痕说明" />'+
        '<button class="btn" id="wa">记录</button>'+
      '</div>'+
      '<h3>📌 今日事件（'+list.length+'）</h3>'+
      '<div id="wlist"></div>'+
      '<div class="hint">💡 切换到「时间记录」日历，可查看任意日期的工作留痕。</div>'+
    '</div>'+
    '<div class="card work-panel">'+
      '<h2>🗓️ 按日期查看</h2>'+
      '<div class="row">'+
        '<input type="date" id="wdate" value="'+td+'" style="width:auto" />'+
        '<button class="btn ghost" id="wfind">查看</button>'+
      '</div>'+
      '<div id="wbydate"></div>'+
    '</div>';
  const wl=$('#wlist');
  if(!list.length) wl.innerHTML='<div class="empty">今天还没有工作记录</div>';
  list.sort(function(a,b){ return b.id.localeCompare(a.id); }).forEach(function(e){
    const d=document.createElement('div'); d.className='item';
    d.innerHTML='<div class="txt"><span class="tag">'+(e.tag||'其他')+'</span> <b>'+esc(e.title)+'</b><br><span class="wk-detail">'+esc(e.detail||'')+'</span></div>'+
      '<div class="act"><button class="mini-btn del" data-d="'+e.id+'">删</button></div>';
    wl.appendChild(d);
  });
  wl.querySelectorAll('[data-d]').forEach(function(b){ b.onclick=function(){ evs=evs.filter(function(x){ return x.id!==b.dataset.d; }); store.set('work_evs',evs); workRender(); }; });
  $('#wa').onclick=function(){ const title=$('#wt').value.trim(); if(!title) return; evs.push({id:uid(),date:td,title:title,detail:$('#wd').value.trim(),tag:$('#wtag').value}); store.set('work_evs',evs); workRender(); };
  $('#wfind').onclick=function(){
    const dv=$('#wdate').value; const arr=evs.filter(function(e){ return e.date===dv; });
    const box=$('#wbydate');
    if(!arr.length){ box.innerHTML='<div class="empty">该日无工作记录</div>'; return; }
    box.innerHTML=arr.map(function(e){ return '<div class="item"><div class="txt"><span class="tag">'+(e.tag||'其他')+'</span> <b>'+esc(e.title)+'</b><br><span class="wk-detail">'+esc(e.detail||'')+'</span></div></div>'; }).join('');
  };
  navBadge('work', list.length);
}

  {t:'重要的事当面/电话说',ex:'容易产生误会的敏感话题，别用文字拉锯。一个3分钟电话，能省掉3天的内心戏。'},
  {t:'会后发一句总结',ex:'“刚才确认了三件事：A归我、B归你、周五对进度。”一句话立住靠谱人设，也防止扯皮。'},
  {t:'允许自己不完美回应',ex:'被冒犯时不必当场漂亮反击。可以说“我需要先消化一下”，给自己留白，反而更从容。'},

  {t:'承认不知情不可怕',ex:'“这块我不太熟，我查一下回头同步你。”坦诚比硬撑更赢得信任。'},
  {t:'用肢体语言放大善意',ex:'说话时身体微微前倾、放下手机，对方能感到被重视，沟通效率翻倍。'},
  {t:'冲突后主动破冰',ex:'冷战别等对方先低头。一句“昨天我也有点急，咱们翻篇？”往往瞬间化解僵局。'},
  {t:'把功劳分给协作方',ex:'汇报时提一句“多亏XX配合”，你不会被埋没，反而圈粉无数，下次别人也愿意挺你。'}
];
function growRender(){
  const p=panel('grow');
  const d=today(); let h=0; for(const c of d) h=(h*17+c.charCodeAt(0))>>>0;
  const daily=GROWTH[h%GROWTH.length];
  const recent=[];
  for(let i=0;i<5;i++){ const dd=addDays(d,-i); let hh=0; for(const c of dd) hh=(hh*17+c.charCodeAt(0))>>>0; recent.push({dd:dd,t:GROWTH[hh%GROWTH.length]}); }
  p.innerHTML=
    '<div class="card grow-panel">'+
      '<h2>🌱 成长资源</h2>'+
      '<div class="sub">每日一个女性成长沟通必备小技巧，附实用示例，今天也要悄悄变厉害 💛</div>'+
      '<div class="tip" style="border:2px solid var(--yellow-soft)">'+
        '<div class="day">📅 '+d+' · 今日技巧</div>'+
        '<div class="ttl">💡 '+daily.t+'</div>'+
        '<div class="ex">🗣️ 示例：'+daily.ex+'</div>'+
      '</div>'+
      '<h3>📚 近期回顾</h3>'+
      '<div id="gRecent"></div>'+
    '</div>';
  const gr=$('#gRecent');
  recent.slice(1).forEach(function(r){
    const d0=document.createElement('div'); d0.className='tip';
    d0.innerHTML='<div class="day">'+r.dd+'</div><div class="ttl">'+r.t+'</div><div class="ex">'+r.ex+'</div>';
    gr.appendChild(d0);
  });
  navBadge('grow',0);
}
